<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GameForge — Игровая платформа</title>
<style>
:root{--bg:#09090b;--bg2:#18181b;--bg3:#27272a;--text:#fafafa;--text2:#a1a1aa;--accent:#10b981;--accent2:#059669;--border:#27272a;--shadow:rgba(0,0,0,.5);--card:#18181b;--overlay:rgba(0,0,0,.85);--toast:#18181b;--danger:#ef4444;--danger2:#dc2626}
[data-theme="light"]{--bg:#fafafa;--bg2:#ffffff;--bg3:#f4f4f5;--text:#09090b;--text2:#71717a;--accent:#059669;--accent2:#047857;--border:#e4e4e7;--shadow:rgba(0,0,0,.08);--card:#ffffff;--overlay:rgba(0,0,0,.6);--toast:#ffffff;--danger:#ef4444;--danger2:#dc2626}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s;overflow-x:hidden}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:4px}
header{position:sticky;top:0;z-index:100;background:var(--bg);padding:16px 24px;transition:box-shadow .3s,background .3s;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
header.scrolled{box-shadow:0 4px 20px var(--shadow);background:var(--bg2)}
.logo{font-size:24px;font-weight:800;letter-spacing:-1px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo span{color:var(--accent)}
.search-box{flex:1;min-width:200px;max-width:400px;position:relative}
.search-box input{width:100%;padding:10px 16px 10px 40px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:14px;outline:none;transition:border .2s}
.search-box input:focus{border-color:var(--accent)}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text2)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filter-btn{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:13px;transition:all .2s}
.filter-btn:hover,.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.actions{display:flex;gap:8px;margin-left:auto}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.icon-btn:hover{background:var(--bg3);border-color:var(--accent);color:var(--accent)}
.stats-bar{padding:12px 24px;display:flex;gap:24px;font-size:13px;color:var(--text2);border-bottom:1px solid var(--border)}
.stats-bar strong{color:var(--accent)}
main{padding:24px;max-width:1200px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--border);transition:transform .25s,box-shadow .25s;cursor:pointer;position:relative}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 32px var(--shadow)}
.card-cover{height:160px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card-cover .play-icon{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s;position:absolute}
.card:hover .play-icon{opacity:1}
.card-cover .type-badge{position:absolute;top:10px;left:10px;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;background:rgba(0,0,0,.5);color:#fff;text-transform:uppercase;backdrop-filter:blur(4px)}
.card-body{padding:16px}
.card-body h3{font-size:16px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-body .author{font-size:13px;color:var(--text2);margin-bottom:6px}
.card-body .desc{font-size:12px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:10px;min-height:36px}
.card-body .tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.card-body .tags span{padding:3px 8px;border-radius:6px;font-size:11px;background:var(--bg3);color:var(--text2)}
.card-footer{display:flex;align-items:center;justify-content:space-between;padding:0 16px 14px}
.card-footer .counters{display:flex;gap:12px;font-size:13px;color:var(--text2)}
.card-footer .counters span{display:flex;align-items:center;gap:4px}
.like-btn{background:none;border:none;color:var(--text2);cursor:pointer;font-size:18px;display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;transition:all .2s}
.like-btn:hover,.like-btn.liked{color:#ef4444}
.like-btn.liked svg{fill:#ef4444}
.delete-btn{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:8px;border:none;background:rgba(0,0,0,.5);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s;backdrop-filter:blur(4px);font-size:16px}
.card:hover .delete-btn{opacity:1}
.delete-btn:hover{background:var(--danger)}
.empty-state{text-align:center;padding:80px 20px;color:var(--text2)}
.empty-state svg{margin-bottom:20px;opacity:.4}
.empty-state h2{margin-bottom:8px;color:var(--text);font-size:22px}
.empty-state p{margin-bottom:24px;font-size:14px;max-width:400px;margin-left:auto;margin-right:auto}
.upload-btn{padding:12px 28px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
.upload-btn:hover{background:var(--accent2)}
.overlay{position:fixed;inset:0;z-index:200;background:var(--overlay);display:none;align-items:center;justify-content:center;animation:fadeIn .2s}
.overlay.open{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.player-wrap{width:95vw;height:90vh;background:#000;border-radius:12px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.player-wrap iframe{width:100%;height:100%;border:none}
.player-close{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:10px;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);transition:background .2s;z-index:10}
.player-close:hover{background:var(--danger)}
.sheet-overlay{position:fixed;inset:0;z-index:200;background:var(--overlay);display:none;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.sheet-overlay.open{display:flex}
.sheet{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:28px;animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.sheet-header h2{font-size:20px;font-weight:700}
.sheet-close{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.sheet-close:hover{background:var(--bg3);border-color:var(--danger);color:var(--danger)}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text2)}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:14px;outline:none;transition:border .2s;font-family:inherit}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:120px;font-family:'Courier New',monospace;font-size:13px}
.mode-tabs{display:flex;gap:8px;margin-bottom:20px}
.mode-tab{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:14px;font-weight:500;text-align:center;transition:all .2s}
.mode-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.drop-zone{border:2px dashed var(--border);border-radius:12px;padding:40px 20px;text-align:center;color:var(--text2);cursor:pointer;transition:all .2s;margin-bottom:16px}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--accent);background:rgba(16,185,129,.05)}
.drop-zone p{margin-bottom:8px;font-size:14px}
.drop-zone small{font-size:12px;opacity:.7}
.drop-zone input{display:none}
.submit-btn{width:100%;padding:14px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
.submit-btn:hover{background:var(--accent2)}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}
.toast-container{position:fixed;bottom:24px;right:24px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:10px;background:var(--toast);border:1px solid var(--border);color:var(--text);font-size:14px;box-shadow:0 8px 24px var(--shadow);animation:toastIn .3s;display:flex;align-items:center;gap:8px}
.toast.success{border-left:3px solid var(--accent)}.toast.error{border-left:3px solid var(--danger)}.toast.info{border-left:3px solid #3b82f6}
.data-actions{display:flex;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.data-btn{flex:1;padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text);cursor:pointer;font-size:13px;font-weight:500;transition:all .2s;text-align:center}
.data-btn:hover{border-color:var(--accent);color:var(--accent)}
.data-btn.danger{color:var(--danger)}.data-btn.danger:hover{border-color:var(--danger);background:rgba(239,68,68,.1)}
.version-info{font-size:11px;color:var(--text2);margin-top:12px;text-align:center}
.version-info span{color:var(--accent);font-weight:600}
.sync-badge{font-size:11px;padding:3px 8px;border-radius:6px;font-weight:600;display:inline-flex;align-items:center;gap:4px;vertical-align:middle;margin-left:6px}
.sync-badge.synced{background:rgba(16,185,129,.15);color:#10b981}
.sync-badge.syncing{background:rgba(59,130,246,.15);color:#3b82f6}
.sync-badge.error{background:rgba(239,68,68,.15);color:#ef4444}
.sync-badge.off{background:var(--bg3);color:var(--text2)}
.sync-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.sync-badge.synced .sync-dot{background:#10b981}
.sync-badge.syncing .sync-dot{background:#3b82f6;animation:pulse 1s infinite}
.sync-badge.error .sync-dot{background:#ef4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
.analytics-panel{background:var(--bg2);border-radius:16px;width:95%;max-width:700px;max-height:90vh;overflow-y:auto;padding:24px;animation:slideUp .3s}
.analytics-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.analytics-header h2{font-size:20px;font-weight:700}
.analytics-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px}
.a-card{background:var(--bg3);border-radius:12px;padding:16px;border:1px solid var(--border)}
.a-card .a-val{font-size:28px;font-weight:800;color:var(--accent);line-height:1.2}
.a-card .a-label{font-size:12px;color:var(--text2);margin-top:4px}
.analytics-section{margin-bottom:24px}
.analytics-section h3{font-size:15px;font-weight:700;margin-bottom:12px}
.chart{display:flex;align-items:flex-end;gap:6px;height:120px;padding:8px 0}
.chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.chart-bar-wrap .bar{width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;transition:height .3s;opacity:.8}
.chart-bar-wrap .bar:hover{opacity:1}
.chart-bar-wrap .bar-plays{width:100%;background:#3b82f6;border-radius:4px 4px 0 0;min-height:2px;transition:height .3s;opacity:.8}
.chart-bar-wrap .bar-plays:hover{opacity:1}
.chart-bar-wrap .bar-label{font-size:9px;color:var(--text2);white-space:nowrap}
.top-game-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:var(--bg3);margin-bottom:8px;border:1px solid var(--border)}
.top-game-item .tg-rank{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.top-game-item .tg-info{flex:1;min-width:0}
.top-game-item .tg-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-game-item .tg-plays{font-size:13px;color:var(--accent);font-weight:700;flex-shrink:0}
@media(max-width:640px){header{padding:12px 16px}.search-box{min-width:100%;order:5}.filters{width:100%;order:6}.stats-bar{padding:10px 16px;gap:16px}main{padding:16px}.grid{grid-template-columns:1fr}.sheet{padding:20px}.player-wrap{width:100vw;height:100vh;border-radius:0}.analytics-cards{grid-template-columns:1fr 1fr}.analytics-panel{padding:16px;width:100%;max-width:100%;border-radius:16px 16px 0 0;max-height:100vh}}
</style>
</head>
<body data-theme="dark">

<header id="header">
  <div class="logo">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    Game<span>Forge</span>
  </div>
  <div class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Поиск по названию, автору, тегам...">
  </div>
  <div class="filters">
    <button class="filter-btn active" data-platform="all">Все</button>
    <button class="filter-btn" data-platform="pc">PC</button>
    <button class="filter-btn" data-platform="mobile">Мобильные</button>
  </div>
  <div class="actions">
    <button class="icon-btn" id="uploadBtn" title="Загрузить игру">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="icon-btn" id="syncBtn" title="Синхронизация">      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>    </button>    <button class="icon-btn" id="dataBtn" title="Управление данными">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
    </button>
    <button class="icon-btn" id="analyticsBtn" title="Аналитика">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" title="Сменить тема">
      <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
  </div>
</header>

<div class="stats-bar" id="statsBar">
  <div>Игр: <strong id="statGames">0</strong></div>
  <div>Запусков: <strong id="statPlays">0</strong></div>
  <div id="syncStatus"></div>
</div>

<main>
  <div class="grid" id="catalog"></div>
  <div class="empty-state" id="emptyState" style="display:none">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="6" width="20" height="12" rx="2"/><line x1="6" y1="10" x2="6" y2="14"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
    <h2>Игр пока нет</h2>
    <p>Начните коллекцию — загрузите свою первую игру прямо сейчас</p>
    <button class="upload-btn" onclick="openUpload()">Загрузить игру</button>
  </div>
</main>

<div class="overlay" id="playerOverlay">
  <div class="player-wrap">
    <button class="player-close" id="playerClose">&times;</button>
    <iframe id="playerFrame" sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-pointer-lock"></iframe>
  </div>
</div>

<div class="sheet-overlay" id="uploadSheet">
  <div class="sheet">
    <div class="sheet-header">
      <h2>Загрузить игру</h2>
      <button class="sheet-close" id="uploadClose">&times;</button>
    </div>
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="code">HTML-код</button>
      <button class="mode-tab" data-mode="file">Файл</button>
    </div>
    <form id="uploadForm" onsubmit="return false">
      <div class="form-group">
        <label>Название *</label>
        <input type="text" id="fTitle" placeholder="Моя крутая игра" required>
      </div>
      <div class="form-group">
        <label>Автор *</label>
        <input type="text" id="fAuthor" placeholder="Имя автора" required>
      </div>
      <div class="form-group">
        <label>Описание</label>
        <input type="text" id="fDesc" placeholder="Краткое описание игры">
      </div>
      <div class="form-group">
        <label>Теги (через запятую)</label>
        <input type="text" id="fTags" placeholder="аркада, пазл, мультиплеер">
      </div>
      <div class="form-group">
        <label>Платформа</label>
        <select id="fPlatform">
          <option value="all">Все</option>
          <option value="pc">PC</option>
          <option value="mobile">Мобильные</option>
        </select>
      </div>
      <div id="codeMode">
        <div class="form-group">
          <label>HTML-код *</label>
          <textarea id="fCode" placeholder="<!DOCTYPE html>&#10;<html>..."></textarea>
        </div>
      </div>
      <div id="fileMode" style="display:none">
        <div class="drop-zone" id="dropZone">
          <input type="file" id="fFile">
          <p>Перетащите файл сюда или нажмите для выбора</p>
          <small>HTML, EXE, APK, AAB, ZIP, RAR и другие</small>
        </div>
        <div id="fileInfo" style="display:none;padding:8px 0;font-size:13px;color:var(--text2)"></div>
      </div>
      <button type="button" class="submit-btn" id="submitBtn">Загрузить</button>
    </form>
  </div>
</div>

<div class="overlay" id="analyticsOverlay">
  <div class="analytics-panel">
    <div class="analytics-header">
      <h2>Аналитика</h2>
      <button class="sheet-close" id="analyticsClose">&times;</button>
    </div>
    <div class="analytics-cards" id="analyticsCards"></div>
    <div class="analytics-section">
      <h3>Посещения за 14 дней</h3>
      <div class="chart" id="visitChart"></div>
    </div>
    <div class="analytics-section">
      <h3>Запуски игр за 14 дней</h3>
      <div class="chart" id="playsChart"></div>
    </div>
    <div class="analytics-section">
      <h3>Популярные игры (Топ 5)</h3>
      <div id="topGames"></div>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
(function(){
"use strict";

var db=null;
var games=[];
var liked=[];
var currentPlatform="all";
var currentSearch="";
var uploadMode="code";
var selectedFile=null;
var currentBlobUrl=null;
var DATA_VERSION=2;
var IDB_VERSION=2;

/* ── Utilities ── */
function hashStr(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return Math.abs(h)}

function gradientFromTitle(title){
  var h=hashStr(title||"game");
  var h1=h%360;var h2=(h1+40+((h>>8)%60))%360;
  return"linear-gradient(135deg,hsl("+h1+",70%,40%),hsl("+h2+",60%,30%))";
}

function formatSize(bytes){
  if(!bytes||bytes===0)return"0 Б";
  if(bytes<1024)return bytes+" Б";
  if(bytes<1048576)return(bytes/1024).toFixed(1)+" КБ";
  return(bytes/1048576).toFixed(1)+" МБ";
}

/* ── IndexedDB ── */
function openDB(){
  return new Promise(function(resolve,reject){
    if(db){resolve(db);return}
    var req=indexedDB.open("GameForgeFiles",IDB_VERSION);
    req.onupgradeneeded=function(e){
      var d=e.target.result;
      var oldVer=e.oldVersion;
      if(oldVer<1){
        if(!d.objectStoreNames.contains("files"))d.createObjectStore("files",{keyPath:"id"});
      }
      if(oldVer<2){
        if(!d.objectStoreNames.contains("meta"))d.createObjectStore("meta",{keyPath:"key"});
      }
    };
    req.onsuccess=function(e){
      db=e.target.result;
      db.onversionchange=function(){db.close();db=null};
      resolve(db);
    };
    req.onerror=function(e){reject(e.target.error)};
  });
}

function saveDBMeta(key,value){
  return openDB().then(function(d){
    return new Promise(function(resolve,reject){
      var tx=d.transaction("meta","readwrite");
      tx.objectStore("meta").put({key:key,value:value});
      tx.oncomplete=function(){resolve()};
      tx.onerror=function(e){reject(e.target.error)};
    });
  });
}

function getDBMeta(key){
  return openDB().then(function(d){
    return new Promise(function(resolve,reject){
      var tx=d.transaction("meta","readonly");
      var req=tx.objectStore("meta").get(key);
      req.onsuccess=function(){resolve(req.result?req.result.value:null)};
      req.onerror=function(e){reject(e.target.error)};
    });
  });
}

function saveFileToDB(id,blob){
  return openDB().then(function(d){
    return new Promise(function(resolve,reject){
      var tx=d.transaction("files","readwrite");
      tx.objectStore("files").put({id:id,data:blob});
      tx.oncomplete=function(){resolve()};
      tx.onerror=function(e){reject(e.target.error)};
    });
  });
}

function getFileFromDB(id){
  return openDB().then(function(d){
    return new Promise(function(resolve,reject){
      var tx=d.transaction("files","readonly");
      var req=tx.objectStore("files").get(id);
      req.onsuccess=function(){resolve(req.result?req.result.data:null)};
      req.onerror=function(e){reject(e.target.error)};
    });
  });
}

function deleteFileFromDB(id){
  return openDB().then(function(d){
    return new Promise(function(resolve,reject){
      var tx=d.transaction("files","readwrite");
      tx.objectStore("files").delete(id);
      tx.oncomplete=function(){resolve()};
      tx.onerror=function(e){reject(e.target.error)};
    });
  });
}

/* ── Data Migration ── */
function migrateData(){
  var savedVer=parseInt(localStorage.getItem("gameforge_version")||"0");
  if(savedVer<DATA_VERSION){
    if(savedVer===0){
      migrateV0toV1();
    }
    if(savedVer<2){
      migrateV1toV2();
    }
    localStorage.setItem("gameforge_version",String(DATA_VERSION));
    saveDBMeta("dataVersion",DATA_VERSION);
  }
}

function migrateV0toV1(){
  try{
    var d=localStorage.getItem("gameforge_games");
    if(d){
      var arr=JSON.parse(d);
      for(var i=0;i<arr.length;i++){
        if(!arr[i].createdAt)arr[i].createdAt=new Date().toISOString();
        if(arr[i].plays===undefined)arr[i].plays=0;
        if(arr[i].likes===undefined)arr[i].likes=0;
        if(!arr[i].platform)arr[i].platform="all";
      }
      localStorage.setItem("gameforge_games",JSON.stringify(arr));
    }
  }catch(e){console.warn("Migration v0->v1 error",e)}
}

function migrateV1toV2(){
  try{
    var d=localStorage.getItem("gameforge_games");
    if(d){
      var arr=JSON.parse(d);
      for(var i=0;i<arr.length;i++){
        if(arr[i].fileType===undefined){
          arr[i].fileType=arr[i].htmlContent?"html":"binary";
          if(!arr[i].fileName)arr[i].fileName=null;
          if(!arr[i].fileSize)arr[i].fileSize=0;
        }
        if(arr[i].authorName===undefined)arr[i].authorName="Unknown";
      }
      localStorage.setItem("gameforge_games",JSON.stringify(arr));
    }
  }catch(e){console.warn("Migration v1->v2 error",e)}
}

/* ── localStorage ── */
function loadGames(){
  try{
    var d=localStorage.getItem("gameforge_games");
    games=d?JSON.parse(d):[];
    validateGames();
  }catch(e){
    console.warn("loadGames error, trying backup...",e);
    games=tryRecoverGames();
  }
}

function validateGames(){
  var clean=[];
  for(var i=0;i<games.length;i++){
    var g=games[i];
    if(!g||!g.id||!g.title)continue;
    if(g.fileType!=="html"&&g.fileType!=="binary")g.fileType=g.htmlContent?"html":"binary";
    if(!g.createdAt)g.createdAt=new Date().toISOString();
    if(!g.plays)g.plays=0;
    if(!g.likes)g.likes=0;
    if(!g.platform)g.platform="all";
    if(!g.description)g.description="";
    if(!g.tags)g.tags="";
    if(!g.authorName)g.authorName="Unknown";
    clean.push(g);
  }
  if(clean.length!==games.length){
    games=clean;
    saveGames();
  }
}

function tryRecoverGames(){
  try{
    var raw=localStorage.getItem("gameforge_games");
    if(!raw)return[];
    var fixed=raw.replace(/[\x00-\x1F\x7F]/g,function(c){return"\\u"+("0000"+c.charCodeAt(0).toString(16)).slice(-4)});
    return JSON.parse(fixed);
  }catch(e2){return[]}
}

    if(currentPlatform!=="all"&&g.platform!==currentPlatform&&g.platform!=="all")return false;
    if(q){
      return g.title.toLowerCase().indexOf(q)!==-1||
             g.authorName.toLowerCase().indexOf(q)!==-1||

/* ── Player ── */
function openPlayer(gameId){
  var g=null;for(var i=0;i<games.length;i++){if(games[i].id===gameId){g=games[i];break}}
  if(!g){showToast("Игра не найдена","error");return}
  g.plays=(g.plays||0)+1;saveGames();trackGamePlay(gameId);
  if(g.fileType==="binary"){downloadBinary(g);return}
  var code=g.htmlContent||"";
  var frame=document.getElementById("playerFrame");
  frame.srcdoc=code;
  document.getElementById("playerOverlay").classList.add("open");
  document.body.style.overflow="hidden";
  renderCatalog();
}

function closePlayer(){
  var frame=document.getElementById("playerFrame");
  frame.srcdoc="";
  document.getElementById("playerOverlay").classList.remove("open");
  document.body.style.overflow="";
}

function downloadBinary(g){
  getFileFromDB(g.id).then(function(blob){
    if(!blob){showToast("Файл не найден в хранилище","error");return}
    if(currentBlobUrl)URL.revokeObjectURL(currentBlobUrl);
    currentBlobUrl=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=currentBlobUrl;
    a.download=g.fileName||"game";
    document.body.appendChild(a);a.click();a.remove();
    renderCatalog();
  }).catch(function(e){showToast("Ошибка загрузки файла","error");console.error(e)});
}

function setUploadMode(mode){
  uploadMode=mode;
  var tabs=document.querySelectorAll(".mode-tab");
  for(var i=0;i<tabs.length;i++){
    tabs[i].classList.toggle("active",tabs[i].getAttribute("data-mode")===mode);
  }

function submitUpload(){
  var title=document.getElementById("fTitle").value.trim();
  var author=document.getElementById("fAuthor").value.trim();
  var desc=document.getElementById("fDesc").value.trim();
  var tags=document.getElementById("fTags").value.trim();
  var platform=document.getElementById("fPlatform").value;
  if(!title){showToast("Введите название игры","error");return}
  if(!author){showToast("Введите имя автора","error");return}

  if(uploadMode==="code"){
    var code=document.getElementById("fCode").value;
    if(!code.trim()){showToast("Введите HTML-код","error");return}
    var game={
      id:genId(),title:title,authorName:author,description:desc,tags:tags,
      platform:platform,htmlContent:code,fileType:"html",fileName:null,
      fileSize:0,plays:0,likes:0,createdAt:new Date().toISOString()
    };
    games.unshift(game);saveGames();renderCatalog();closeUpload();
    showToast("Игра «"+title+"» загружена!","success");
  }else{
    if(!selectedFile){showToast("Выберите файл","error");return}
    var reader=new FileReader();
    var fileExt=selectedFile.name.split(".").pop().toLowerCase();
    if(fileExt==="html"||fileExt==="htm"){
      reader.onload=function(e){
        var game={
          id:genId(),title:title,authorName:author,description:desc,tags:tags,
          platform:platform,htmlContent:e.target.result,fileType:"html",
          fileName:selectedFile.name,fileSize:selectedFile.size,
          plays:0,likes:0,createdAt:new Date().toISOString()
        };
        games.unshift(game);saveGames();renderCatalog();closeUpload();
        showToast("Игра «"+title+"» загружена!","success");
      };
      reader.onerror=function(){showToast("Ошибка чтения файла","error")};
      reader.readAsText(selectedFile);
    }else{
      reader.onload=function(e){
        var game={
          id:genId(),title:title,authorName:author,description:desc,tags:tags,
          platform:platform,htmlContent:"",fileType:"binary",
          fileName:selectedFile.name,fileSize:selectedFile.size,
          plays:0,likes:0,createdAt:new Date().toISOString()
        };
        saveFileToDB(game.id,e.target.result).then(function(){
          games.unshift(game);saveGames();renderCatalog();closeUpload();
          showToast("Игра «"+title+"» загружена!","success");
        }).catch(function(err){
          showToast("Ошибка сохранения файла в IndexedDB","error");console.error(err);
        });
      };
      reader.onerror=function(){showToast("Ошибка чтения файла","error")};
      reader.readAsArrayBuffer(selectedFile);
    }
  }
}

/* ── Delete ── */
function deleteGame(id){
  var g=null;for(var i=0;i<games.length;i++){if(games[i].id===id){g=games[i];break}}
  if(!g)return;
  var name=g.title;
  if(!confirm('Удалить игру «'+name+'»?'))return;
  if(g.fileType==="binary"){
    deleteFileFromDB(id).catch(function(e){console.warn("DB delete error",e)});
  }
  var idx=liked.indexOf(id);if(idx!==-1){liked.splice(idx,1);saveLiked()}
  for(var i=0;i<games.length;i++){if(games[i].id===id){games.splice(i,1);break}}
  saveGames();renderCatalog();showToast("Игра «"+name+"» удалена","info");
}

/* ── Likes ── */
function toggleLike(id){
  var idx=liked.indexOf(id);
  var g=null;for(var i=0;i<games.length;i++){if(games[i].id===id){g=games[i];break}}
  if(!g)return;
  if(idx===-1){liked.push(id);g.likes=(g.likes||0)+1}else{liked.splice(idx,1);g.likes=Math.max(0,(g.likes||0)-1)}
  saveLiked();saveGames();renderCatalog();
}

/* ── Drag and drop ── */

  zone.addEventListener("dragleave",function(e){e.preventDefault();e.stopPropagation();zone.classList.remove("dragover")});
  zone.addEventListener("drop",function(e){
    e.preventDefault();e.stopPropagation();zone.classList.remove("dragover");
    if(e.dataTransfer.files.length>0)handleFileSelect(e.dataTransfer.files);
  });
}

/* ── Analytics ── */
var analytics={};

function loadAnalytics(){
  try{
    var d=localStorage.getItem("gf_analytics");
    analytics=d?JSON.parse(d):{visits:[],visitorId:genId(),dailyPlays:{}};
    if(!analytics.visits)analytics.visits=[];
    if(!analytics.visitorId)analytics.visitorId=genId();
    if(!analytics.dailyPlays)analytics.dailyPlays={};
  }catch(e){
    analytics={visits:[],visitorId:genId(),dailyPlays:{}};
  }
}

function saveAnalytics(){
  try{localStorage.setItem("gf_analytics",JSON.stringify(analytics))}catch(e){}
}

function trackVisit(){
  var today=dateKey(new Date());
  var lastVisit=analytics.visits.length>0?analytics.visits[analytics.visits.length-1]:"";
  if(lastVisit===today)return;
  analytics.visits.push(today);
  if(analytics.visits.length>365)analytics.visits=analytics.visits.slice(-365);
  saveAnalytics();
}

function trackGamePlay(gameId){
  var today=dateKey(new Date());
  if(!analytics.dailyPlays[today])analytics.dailyPlays[today]={};
  analytics.dailyPlays[today][gameId]=(analytics.dailyPlays[today][gameId]||0)+1;
  saveAnalytics();
}

function dateKey(d){
  var y=d.getFullYear();
  var m=String(d.getMonth()+1).padStart(2,"0");
  var day=String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+day;
}

function shortDay(dateStr){
  var days=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
  var d=new Date(dateStr+"T12:00:00");
  return days[d.getDay()];
}

function countTodayVisits(){
  var today=dateKey(new Date());
  var c=0;
  for(var i=0;i<analytics.visits.length;i++){if(analytics.visits[i]===today)c++}
  return c;
}

function countTotalPlaysLastNDays(n){
  var now=new Date();
  var total=0;
  for(var i=0;i<n;i++){
    var d=new Date(now);d.setDate(d.getDate()-i);
    var key=dateKey(d);
    if(analytics.dailyPlays[key]){
      var plays=analytics.dailyPlays[key];
      for(var gid in plays)total+=plays[gid];
    }
  }
  return total;
}

function renderVisitChart(){
  var days=getLast14Days();
  var counts=[];
  var maxC=1;
  for(var i=0;i<days.length;i++){
    var c=0;
    for(var j=0;j<analytics.visits.length;j++){if(analytics.visits[j]===days[i])c++}
    counts.push(c);
    if(c>maxC)maxC=c;
  }
  var html="";
  for(var i=0;i<days.length;i++){
    var h=Math.max(4,Math.round((counts[i]/maxC)*100));
    html+='<div class="chart-bar-wrap"><div class="bar" style="height:'+h+'%"></div><div class="bar-label">'+shortDay(days[i])+'</div></div>';
  }
  document.getElementById("visitChart").innerHTML=html;
}

function renderPlaysChart(){
  var days=getLast14Days();
  var counts=[];
  var maxC=1;
  for(var i=0;i<days.length;i++){
    var c=0;
    if(analytics.dailyPlays[days[i]]){
      for(var gid in analytics.dailyPlays[days[i]])c+=analytics.dailyPlays[days[i]][gid];
    }
    counts.push(c);
    if(c>maxC)maxC=c;
  }
  var html="";
  for(var i=0;i<days.length;i++){
    var h=Math.max(4,Math.round((counts[i]/maxC)*100));
    html+='<div class="chart-bar-wrap"><div class="bar-plays" style="height:'+h+'%"></div><div class="bar-label">'+shortDay(days[i])+'</div></div>';
  }
  document.getElementById("playsChart").innerHTML=html;
}

function renderTopGames(){
  var totals={};
  for(var day in analytics.dailyPlays){
    for(var gid in analytics.dailyPlays[day]){
      totals[gid]=(totals[gid]||0)+analytics.dailyPlays[day][gid];
    }
  }
  var sorted=[];
  for(var gid in totals)sorted.push({id:gid,plays:totals[gid]});
  sorted.sort(function(a,b){return b.plays-a.plays});

  var top5=sorted.slice(0,5);
  if(top5.length===0){
    document.getElementById("topGames").innerHTML='<div style="color:var(--text2);font-size:13px;padding:12px">Пока нет данных о запусках</div>';
    return;
  }
  var html="";
  for(var i=0;i<top5.length;i++){
    var g=null;for(var j=0;j<games.length;j++){if(games[j].id===top5[i].id){g=games[j];break}}
    var name=g?g.title:"Удалённая игра";
    html+='<div class="top-game-item"><div class="tg-rank">'+(i+1)+'</div><div class="tg-info"><div class="tg-name">'+escapeHtml(name)+'</div></div><div class="tg-plays">'+top5[i].plays+' запусков</div></div>';
  }
  document.getElementById("topGames").innerHTML=html;
}

function getLast14Days(){
  var days=[];var now=new Date();
  for(var i=13;i>=0;i--){
    var d=new Date(now);d.setDate(d.getDate()-i);
    days.push(dateKey(d));
  }
  return days;
}

function exportAllData(){
  var backup={
    version:DATA_VERSION,
    exportedAt:new Date().toISOString(),
    games:games,
    liked:liked,
    analytics:analytics,
    theme:document.body.getAttribute("data-theme")||"dark"
  };
  var json=JSON.stringify(backup,null,2);
  var blob=new Blob([json],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download="gameforge_backup_"+dateKey(new Date())+".json";
  document.body.appendChild(a);a.click();a.remove();
  URL.revokeObjectURL(url);
  showToast("Бэкап создан! Сохраните файл.","success");
}

function importAllData(file){
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var backup=JSON.parse(e.target.result);
      if(!backup.games||!Array.isArray(backup.games)){showToast("Неверный формат бэкапа","error");return}
      var oldCount=games.length;
      var oldIds={};
      for(var i=0;i<games.length;i++)oldIds[games[i].id]=true;
      var added=0;var updated=0;
      for(var i=0;i<backup.games.length;i++){
        var bg=backup.games[i];
        if(!bg||!bg.id||!bg.title)continue;
        if(oldIds[bg.id]){
          for(var j=0;j<games.length;j++){
            if(games[j].id===bg.id){games[j]=bg;updated++;break}
          }
        }else{
          games.push(bg);added++;oldIds[bg.id]=true;
        }
      }
      if(backup.liked&&Array.isArray(backup.liked)){
        var newLiked=[];
        for(var i=0;i<backup.liked.length;i++){
          if(oldIds[backup.liked[i]])newLiked.push(backup.liked[i]);
        }
        liked=newLiked;
        saveLiked();
      }
      if(backup.analytics&&backup.analytics.visits){
        analytics=backup.analytics;
        if(!analytics.dailyPlays)analytics.dailyPlays={};
        if(!analytics.visitorId)analytics.visitorId=genId();
        saveAnalytics();
      }
      if(backup.theme){saveTheme(backup.theme)}
      saveGames();
      renderCatalog();
      showToast('Импорт: +'+added+' новых, '+updated+' обновлено','success');
      closeDataPanel();
    }catch(err){
      showToast('Ошибка чтения бэкапа: '+err.message,"error");
      console.error(err);
    }
  };
  reader.onerror=function(){showToast("Ошибка чтения файла","error")};
  reader.readAsText(file);
}

function clearAllData(){
  localStorage.removeItem("gameforge_games");
  localStorage.removeItem("gameforge_liked");
  localStorage.removeItem("gameforge_theme");
  localStorage.removeItem("gf_analytics");
  localStorage.removeItem("gameforge_version");
  games=[];liked=[];analytics={visits:[],visitorId:genId(),dailyPlays:{}};
  openDB().then(function(d){
    return new Promise(function(resolve,reject){
      var tx=d.transaction(["files","meta"],"readwrite");
      tx.objectStore("files").clear();
      tx.objectStore("meta").clear();
      tx.oncomplete=function(){resolve()};
      tx.onerror=function(e){reject(e.target.error)};
    });
  }).then(function(){
    renderCatalog();
    showToast('Все данные удалены','info');
    closeDataPanel();
  }).catch(function(e){
    showToast('Ошибка: '+e.message,'error');
  });
}

var gh={token:"",owner:"",repo:"",dataPath:"data/gameforge_games.json",sha:null,lastSync:null,syncing:false};
var syncTimer=null;

function loadGhConfig(){
  gh.token=localStorage.getItem("gh_token")||"";
  gh.owner=localStorage.getItem("gh_owner")||"";
  gh.repo=localStorage.getItem("gh_repo")||"";
  gh.lastSync=localStorage.getItem("gh_last_sync")||null;
}
function saveGhConfig(){
  localStorage.setItem("gh_token",gh.token);
  localStorage.setItem("gh_owner",gh.owner);
  localStorage.setItem("gh_repo",gh.repo);
}
function isGhReady(){return gh.token&&gh.owner&&gh.repo}

function ghApi(method,path,body){
  return new Promise(function(resolve,reject){
    var opts={
      method:method,
      headers:{
        "Authorization":"Bearer "+gh.token,
        "Accept":"application/vnd.github+json",
        "X-GitHub-Api-Version":"2022-11-28"
      }
    };
    if(body!==undefined){
      opts.headers["Content-Type"]="application/json";
      opts.body=JSON.stringify(body);
    }
    fetch("https://api.github.com"+path,opts).then(function(r){
      if(r.status===404){resolve(null);return}
      if(!r.ok){r.text().then(function(t){reject(new Error(r.status+": "+t))}).catch(function(){reject(new Error("HTTP "+r.status))});return}
      r.json().then(resolve).catch(reject);
    }).catch(reject);
  });
}

function ghLoadGames(){
  return ghApi("GET","/repos/"+gh.owner+"/"+gh.repo+"/contents/"+gh.dataPath).then(function(data){
    if(!data||!data.content)return[];
    gh.sha=data.sha;
    var text=decodeURIComponent(escape(atob(data.content.replace(/\n/g,""))));
    var parsed=JSON.parse(text);
    return parsed.games||[];
  });
}

function ghSaveGames(gamesToSave){
  var data={version:DATA_VERSION,savedAt:new Date().toISOString(),games:gamesToSave};
  var content=btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  var body={message:"GameForge: auto-sync ("+gamesToSave.length+" games)",content:content};
  if(gh.sha)body.sha=gh.sha;
  return ghApi("PUT","/repos/"+gh.owner+"/"+gh.repo+"/contents/"+gh.dataPath,body).then(function(result){
    if(result&&result.content&&result.content.sha)gh.sha=result.content.sha;
    gh.lastSync=new Date().toISOString();
    localStorage.setItem("gh_last_sync",gh.lastSync);
  });
}

function scheduleSync(){
  if(!isGhReady()||gh.syncing)return;
  if(syncTimer)clearTimeout(syncTimer);
  syncTimer=setTimeout(function(){doSync()},2000);
}

function doSync(){
  if(!isGhReady()||gh.syncing)return;
  gh.syncing=true;
  updateSyncUI("syncing");
  ghSaveGames(games).then(function(){
    gh.syncing=false;
    updateSyncUI("synced");
  }).catch(function(e){
    gh.syncing=false;
    updateSyncUI("error");
    console.warn("[GameForge] sync error",e);
  });
}

function pullFromGitHub(){
  if(!isGhReady())return;
  gh.syncing=true;
  updateSyncUI("syncing");
  ghLoadGames().then(function(remoteGames){
    if(!remoteGames||remoteGames.length===0){
      gh.syncing=false;
      updateSyncUI("synced");
      showToast("На GitHub пока нет сохранённых игр","info");
      return;
    }
    var localIds={};
    for(var i=0;i<games.length;i++)localIds[games[i].id]=true;
    var added=0,updated=0;
    for(var i=0;i<remoteGames.length;i++){
      var rg=remoteGames[i];
      if(!rg||!rg.id||!rg.title)continue;
      if(rg.fileType==="binary")rg.htmlContent="";
      if(!localIds[rg.id]){
        games.unshift(rg);added++;localIds[rg.id]=true;
      }else{
        for(var j=0;j<games.length;j++){
          if(games[j].id===rg.id){
            var remoteDate=new Date(rg.createdAt||0);
            var localDate=new Date(games[j].createdAt||0);
            if(remoteDate>localDate){games[j]=rg;updated++}
            break;
          }
        }
      }
    }
    if(added>0||updated>0){
      saveGames();renderCatalog();
      showToast('Загружено с GitHub: +'+added+' новых, '+updated+' обновлено','success');
    }else{
      showToast('Данные актуальны','info');
    }
    gh.syncing=false;
    updateSyncUI("synced");
  }).catch(function(e){
    gh.syncing=false;
    updateSyncUI("error");
    showToast('Ошибка загрузки с GitHub: '+e.message,'error');
    console.warn(e);
  });
}

function updateSyncUI(state){
  var el=document.getElementById("syncStatus");
  if(!el)return;
  if(!isGhReady()){
    el.innerHTML='<span class="sync-badge off"><span class="sync-dot"></span>Облако выкл</span>';
    return;
  }
  if(state==="syncing"){el.innerHTML='<span class="sync-badge syncing"><span class="sync-dot"></span>Синхронизация...</span>'}
  else if(state==="synced"){
    var t=gh.lastSync?new Date(gh.lastSync).toLocaleTimeString('uk',{hour:'2-digit',minute:'2-digit'}):"";
    el.innerHTML='<span class="sync-badge synced"><span class="sync-dot"></span>Облако '+t+'</span>';
  }
  else if(state==="error"){el.innerHTML='<span class="sync-badge error"><span class="sync-dot"></span>Ошибка синхр.</span>'}
}

function checkDataConsistency(){
  openDB().then(function(d){
    return new Promise(function(resolve,reject){
      var tx=d.transaction("files","readonly");
      var store=tx.objectStore("files");
      var req=store.getAll();
      req.onsuccess=function(){
        var dbFiles=req.result||[];
        var dbIds={};
        for(var i=0;i<dbFiles.length;i++)dbIds[dbFiles[i].id]=true;
        var gameIds={};
        for(var i=0;i<games.length;i++){
          if(games[i].fileType==="binary")gameIds[games[i].id]=true;
        }
        var orphanFiles=0;
        for(var id in dbIds){if(!gameIds[id])orphanFiles++}
        if(orphanFiles>0){
          console.log('[GameForge] orphan files in IndexedDB: '+orphanFiles);
          for(var id in dbIds){
            if(!gameIds[id]){
              var delTx=d.transaction("files","readwrite");
              delTx.objectStore("files").delete(id);
            }
          }
        }
      };
      req.onerror=function(){};
    });
  }).catch(function(){});
}

if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",init)}else{init()}

})();
</script>
