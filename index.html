<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Sasha Engine | No-LLM Power</title>
    <style>
        :root { --bg: #0a0a0c; --accent: #00e5ff; --panel: #16161a; --text: #d1d1d1; }
        body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; margin: 0; overflow: hidden; display: flex; height: 100vh; }
        
        /* Стили чата и панелей */
        .sidebar { width: 350px; background: var(--panel); border-right: 1px solid #333; display: flex; flex-direction: column; }
        .main-view { flex: 1; display: flex; flex-direction: column; padding: 20px; }
        .chat-history { flex: 1; overflow-y: auto; padding: 15px; font-size: 14px; border-bottom: 1px solid #333; }
        .input-box { padding: 15px; }
        textarea { width: 100%; height: 60px; background: #000; color: var(--accent); border: 1px solid #444; padding: 8px; resize: none; outline: none; }
        
        .code-container { flex: 1; background: #000; border: 1px solid var(--accent); position: relative; margin-top: 10px; display: flex; flex-direction: column; }
        .tabs { display: flex; background: #222; }
        .tab { padding: 8px 15px; cursor: pointer; border-right: 1px solid #333; font-size: 12px; }
        .tab.active { background: var(--accent); color: #000; }
        #codeArea { flex: 1; padding: 15px; white-space: pre; overflow: auto; color: #a6e22e; font-size: 13px; }
        
        .btn { background: var(--accent); color: #000; border: none; padding: 10px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn:hover { filter: brightness(1.2); box-shadow: 0 0 15px var(--accent); }
        .msg-ai { color: var(--accent); margin-bottom: 15px; }
        .msg-user { color: #fff; opacity: 0.7; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div id="history" class="chat-history">
        <div class="msg-ai">Sasha Engine: СИСТЕМА ГОТОВА. Жду команду...</div>
    </div>
    <div class="input-box">
        <textarea id="userInput" placeholder="Напр: создать красный куб..."></textarea>
        <button class="btn" onclick="analyzeRequest()">ОБРАБОТАТЬ</button>
    </div>
</div>

<div class="main-view">
    <div class="tabs">
        <div id="tab-js" class="tab active" onclick="setView('js')">JAVASCRIPT</div>
        <div id="tab-cpp" class="tab" onclick="setView('cpp')">C++ (SYSTEM)</div>
        <div id="tab-cs" class="tab" onclick="setView('cs')">C# (ENGINE)</div>
    </div>
    <div class="code-container">
        <div id="codeArea"></div>
        <button id="runBtn" class="btn" style="display:none;" onclick="runVisual()">ИСПОЛНИТЬ В БРАУЗЕРЕ</button>
    </div>
</div>

<script>
    let currentData = { js: "", cpp: "", cs: "", lang: 'js' };

    // База знаний (Шаблоны)
    const Library = {
        cube: {
            js: "document.body.innerHTML += '<div id=\"cube\" style=\"width:100px;height:100px;background:red;margin:50px;transition:2s\"></div>';\nsetTimeout(()=>document.getElementById('cube').style.transform='rotate(45deg)', 100);",
            cpp: "#include <GL/glut.h>\nvoid draw() { glutSolidCube(1.0); } // Отрисовка куба через OpenGL",
            cs: "GameObject cube = GameObject.CreatePrimitive(PrimitiveType.Cube);\ncube.GetComponent<Renderer>().material.color = Color.red;"
        },
        calc: {
            js: "let a = prompt('Число 1'); let b = prompt('Число 2'); alert('Сумма: ' + (Number(a)+Number(b)));",
            cpp: "int a, b; std::cin >> a >> b; std::cout << a + b;",
            cs: "Console.WriteLine(\"Введите числа:\");\nvar res = int.Parse(Console.ReadLine()) + int.Parse(Console.ReadLine());"
        },
        default: {
            js: "console.log('Задача принята к исполнению...');",
            cpp: "// Алгоритм: Проанализировать ввод и выделить память.\nint main() { return 0; }",
            cs: "// Инструкция: Реализовать логику в методе Update()."
        }
    };

    function analyzeRequest() {
        const text = document.getElementById('userInput').value.toLowerCase();
        if(!text) return;

        addChat('user', text);
        document.getElementById('userInput').value = "";

        // Голос
        const speech = new SpeechSynthesisUtterance("Я понял задачу и готов выполнить");
        speech.lang = 'ru-RU';
        window.speechSynthesis.speak(speech);

        // Логика выбора шаблона
        let key = 'default';
        if (text.includes("куб")) key = 'cube';
        if (text.includes("кальк") || text.includes("счит")) key = 'calc';

        currentData.js = Library[key].js;
        currentData.cpp = Library[key].cpp;
        currentData.cs = Library[key].cs;

        addChat('ai', `Сгенерирован код по теме: ${key.toUpperCase()}. Проверьте вкладки.`);
        setView(currentData.lang);
    }

    function setView(lang) {
        currentData.lang = lang;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + lang).classList.add('active');
        document.getElementById('codeArea').innerText = currentData[lang];
        document.getElementById('runBtn').style.display = (lang === 'js') ? 'block' : 'none';
    }

    function runVisual() {
        try { eval(currentData.js); } catch(e) { alert(e); }
    }

    function addChat(role, msg) {
        const h = document.getElementById('history');
        h.innerHTML += `<div class="msg-${role}">${role==='ai'?'Sasha: ':'Вы: '}${msg}</div>`;
        h.scrollTop = h.scrollHeight;
    }
</script>
</body>
</html>
