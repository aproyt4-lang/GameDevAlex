<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>JARVIS MULTI-CORE AI</title>
    <style>
        :root { --neon: #00f2ff; --bg: #050505; --code-bg: #000; }
        body { margin: 0; background: var(--bg); color: var(--neon); font-family: 'Consolas', monospace; display: flex; height: 100vh; overflow: hidden; }
        
        /* Чат-панель */
        #side-panel { width: 450px; border-right: 1px solid var(--neon); display: flex; flex-direction: column; background: #080808; box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
        #log { flex: 1; overflow-y: auto; padding: 20px; scrollbar-width: thin; }
        .bubble { margin-bottom: 20px; animation: fadeIn 0.3s ease; }
        .user { color: #fff; opacity: 0.8; }
        .ai { border-left: 2px solid var(--neon); padding-left: 15px; }
        
        /* Стилизация кода как в LLM */
        .code-block { 
            background: var(--code-bg); 
            border: 1px solid #333; 
            padding: 12px; 
            margin-top: 10px; 
            color: #d4d4d4; 
            white-space: pre-wrap; 
            font-size: 12px; 
            position: relative;
            border-radius: 4px;
        }
        .code-header { 
            font-size: 10px; 
            color: var(--neon); 
            text-transform: uppercase; 
            margin-bottom: 5px; 
            border-bottom: 1px solid #222; 
            padding-bottom: 3px; 
        }

        /* Поле ввода */
        #input-wrap { padding: 20px; border-top: 1px solid var(--neon); background: #0a0a0a; }
        input { width: 100%; background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 12px; outline: none; box-sizing: border-box; }

        /* Вьюпорт */
        #viewport { flex: 1; position: relative; }
        #action-btn { 
            position: absolute; bottom: 30px; left: 30px; 
            padding: 15px 30px; background: var(--neon); color: #000; 
            border: none; cursor: pointer; font-weight: bold; font-family: inherit;
            display: none; box-shadow: 0 0 20px var(--neon);
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="side-panel">
        <div id="log"></div>
        <div id="input-wrap">
            <input type="text" id="userInput" placeholder="Приказ (напр. 'Шутер на C#')..." autocomplete="off">
        </div>
    </div>

    <div id="viewport">
        <button id="action-btn" onclick="executeJS()">ИСПОЛНИТЬ JS В СЦЕНЕ</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ==========================================
        // БЛОК ТВОЕЙ МОДЕЛИ (БЕЗ ИЗМЕНЕНИЙ)
        function INJECT_USER_MODEL(scene) {
            // Твой код загрузки (gltf, obj) пойдет сюда
            console.log("Модель пользователя активна.");
        }
        // ==========================================

        let scene, camera, renderer, lastGeneratedJS = "";

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, (window.innerWidth - 450) / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth - 450, window.innerHeight);
            document.getElementById('viewport').appendChild(renderer.domElement);
            
            scene.add(new THREE.AmbientLight(0x404040));
            camera.position.z = 10;
            
            INJECT_USER_MODEL(scene);
            loop();
        }

        function loop() {
            requestAnimationFrame(loop);
            renderer.render(scene, camera);
        }

        // Логика имитации LLM
        document.getElementById('userInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const val = e.target.value;
                if(!val) return;
                
                printMsg(val, 'user');
                processAI(val);
                e.target.value = '';
            }
        });

        function processAI(query) {
            let lang = "javascript";
            let code = "";
            let response = "Да. Запрос принят. Генерирую структуру...";

            // Детектор языка
            if(query.toLowerCase().includes("c#")) {
                lang = "csharp";
                code = `using UnityEngine;\npublic class PlayerController : MonoBehaviour {\n    void Update() {\n        float move = Input.GetAxis("Vertical") * 10f * Time.deltaTime;\n        transform.Translate(0, 0, move);\n    }\n}`;
            } else if(query.toLowerCase().includes("c++")) {
                lang = "cpp";
                code = `#include <iostream>\nint main() {\n    std::cout << "Jarvis Engine Initialized" << std::endl;\n    return 0;\n}`;
            } else {
                lang = "javascript";
                code = `// Динамический объект\nconst g = new THREE.TorusGeometry(2, 0.5, 16, 100);\nconst m = new THREE.MeshPhongMaterial({ color: 0x00f2ff });\nconst torus = new THREE.Mesh(g, m);\nscene.add(torus);`;
                lastGeneratedJS = code;
                document.getElementById('action-btn').style.display = 'block';
            }

            setTimeout(() => {
                printMsg(`${response} Готов.`, 'ai', code, lang);
            }, 500);
        }

        function printMsg(text, type, code = null, lang = "") {
            const log = document.getElementById('log');
            const div = document.createElement('div');
            div.className = `bubble ${type}`;
            div.innerHTML = `<strong>${type === 'ai' ? 'JARVIS' : 'USER'}:</strong><br>${text}`;
            
            if (code) {
                const pre = document.createElement('div');
                pre.className = 'code-block';
                pre.innerHTML = `<div class="code-header">${lang}</div>${escapeHtml(code)}`;
                div.appendChild(pre);
            }
            
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function executeJS() {
            try {
                const func = new Function('scene', 'THREE', lastGeneratedJS);
                func(scene, THREE);
                document.getElementById('action-btn').style.display = 'none';
            } catch(e) { console.error("Ошибка исполнения JS: ", e); }
        }

        window.onload = init;
    </script>
</body>
</html>
