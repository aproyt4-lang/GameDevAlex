<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>JARVIS ULTIMATE AI TERMINAL</title>
    <style>
        :root { --neon: #00f2ff; --bg: #050505; --panel: #0a0a0a; --text: #e0e0e0; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; height: 100vh; overflow: hidden; }

        /* Левая панель - ЧАТ */
        #ai-interface { width: 500px; border-right: 1px solid #222; display: flex; flex-direction: column; background: var(--panel); }
        #chat-history { flex: 1; overflow-y: auto; padding: 20px; background: radial-gradient(circle at top left, #0d0d0d, #050505); }
        
        .message { margin-bottom: 25px; line-height: 1.5; font-size: 14px; }
        .user-label { color: #888; font-weight: bold; margin-bottom: 5px; font-size: 11px; text-transform: uppercase; }
        .ai-label { color: var(--neon); font-weight: bold; margin-bottom: 5px; font-size: 11px; text-transform: uppercase; }

        /* БЛОК КОДА КАК В LLM */
        .code-container { 
            background: #000; 
            border: 1px solid #333; 
            border-radius: 6px; 
            margin-top: 10px; 
            overflow: hidden; 
            font-family: 'Consolas', 'Monaco', monospace; 
        }
        .code-header { 
            background: #1a1a1a; 
            padding: 5px 15px; 
            font-size: 11px; 
            color: #aaa; 
            display: flex; 
            justify-content: space-between; 
            border-bottom: 1px solid #333; 
        }
        .code-body { padding: 15px; overflow-x: auto; color: #d4d4d4; white-space: pre; font-size: 13px; line-height: 1.4; }

        /* ВВОД */
        #input-container { padding: 20px; border-top: 1px solid #222; }
        input { width: 100%; background: #111; border: 1px solid #333; color: var(--neon); padding: 12px; outline: none; border-radius: 4px; }
        input:focus { border-color: var(--neon); }

        /* Правая панель - ВИЗУАЛ */
        #render-zone { flex: 1; position: relative; }
        canvas { display: block; }
        #play-btn { 
            position: absolute; bottom: 30px; left: 30px; 
            padding: 15px 30px; background: var(--neon); color: #000; 
            border: none; cursor: pointer; font-weight: bold; 
            border-radius: 4px; box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
            display: none;
        }
    </style>
</head>
<body>

    <div id="ai-interface">
        <div id="chat-history"></div>
        <div id="input-container">
            <input type="text" id="prompt" placeholder="Приказ (например: 'враг на c#')..." autocomplete="off">
        </div>
    </div>

    <div id="render-zone">
        <button id="play-btn" onclick="executeJS()">ЗАПУСТИТЬ JS В СЦЕНЕ</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ==========================================
        // БЛОК ТВОЕЙ МОДЕЛИ (НЕ ТРОГАЮ)
        function USER_CUSTOM_MODEL(scene) {
            console.log("Слот для твоей модели готов.");
        }
        // ==========================================

        let scene, camera, renderer, lastJS = "";

        // Инициализация графики
        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, (window.innerWidth - 500) / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth - 500, window.innerHeight);
            document.getElementById('render-zone').appendChild(renderer.domElement);
            
            scene.add(new THREE.AmbientLight(0x404040));
            const sun = new THREE.DirectionalLight(0xffffff, 1);
            sun.position.set(5, 5, 5);
            scene.add(sun);

            camera.position.z = 12;
            USER_CUSTOM_MODEL(scene);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        // Логика "Джарвиса" (Имитация LLM)
        const inputField = document.getElementById('prompt');
        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const text = inputField.value;
                if(!text) return;
                
                addMessage('user', text);
                processCommand(text);
                inputField.value = '';
            }
        });

        function processCommand(cmd) {
            const lowCmd = cmd.toLowerCase();
            let lang = "javascript";
            let code = "";
            let message = "Да. Запрос обработан. Готов.";

            if (lowCmd.includes("c#") || lowCmd.includes("си шарп")) {
                lang = "csharp";
                code = `using UnityEngine;\n\npublic class EnemyController : MonoBehaviour {\n    public float speed = 5.0f;\n    void Update() {\n        transform.Translate(Vector3.forward * speed * Time.deltaTime);\n    }\n}`;
            } else if (lowCmd.includes("c++") || lowCmd.includes("плюс")) {
                lang = "cpp";
                code = `#include <iostream>\n#include "Engine.h"\n\nvoid SpawnEnemy() {\n    Entity* enemy = Engine::CreateEntity("Cube");\n    enemy->SetPosition(0, 5, 10);\n    std::cout << "Enemy Spawned" << std::endl;\n}`;
            } else {
                lang = "javascript";
                code = `// Создаем сферу в реальном времени\nconst geo = new THREE.SphereGeometry(2, 32, 32);\nconst mat = new THREE.MeshPhongMaterial({ color: 0x00f2ff, wireframe: true });\nconst sphere = new THREE.Mesh(geo, mat);\nsphere.position.y = 2;\nscene.add(sphere);\n\nconsole.log("JS объект добавлен в сцену");`;
                lastJS = code;
                document.getElementById('play-btn').style.display = 'block';
            }

            // Имитация задержки "раздумий"
            setTimeout(() => {
                addMessage('ai', message, code, lang);
            }, 400);
        }

        function addMessage(sender, text, code = null, lang = "") {
            const history = document.getElementById('chat-history');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            
            const label = sender === 'user' ? '<div class="user-label">USER</div>' : '<div class="ai-label">JARVIS</div>';
            let codeHtml = "";

            if (code) {
                codeHtml = `
                    <div class="code-container">
                        <div class="code-header"><span>${lang.toUpperCase()}</span><span>Copy</span></div>
                        <div class="code-body">${escapeHtml(code)}</div>
                    </div>
                `;
            }

            msgDiv.innerHTML = `${label}<div>${text}</div>${codeHtml}`;
            history.appendChild(msgDiv);
            history.scrollTop = history.scrollHeight;
        }

        function escapeHtml(unsafe) {
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function executeJS() {
            try {
                const run = new Function('scene', 'THREE', lastJS);
                run(scene, THREE);
                document.getElementById('play-btn').style.display = 'none';
            } catch(e) { alert("Ошибка в коде: " + e); }
        }

        window.onload = initThree;
    </script>
</body>
</html>
