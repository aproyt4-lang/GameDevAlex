<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SASHA AI - GENERATIVE LLM INTERFACE</title>
    <style>
        :root { --neon: #00f2ff; --bg: #050505; --panel: #0a0a0a; }
        body { margin: 0; background: var(--bg); color: #e0e0e0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }

        /* ИНТЕРФЕЙС КАК У ЧАТ ГПТ */
        #side-panel { width: 450px; background: var(--panel); border-right: 1px solid #222; display: flex; flex-direction: column; z-index: 20; box-shadow: 10px 0 30px rgba(0,0,0,0.8); }
        #chat-flow { flex: 1; overflow-y: auto; padding: 25px; scrollbar-width: thin; scrollbar-color: #333 transparent; }
        
        .message { margin-bottom: 30px; animation: fadeIn 0.4s ease; border-bottom: 1px solid #1a1a1a; padding-bottom: 15px; }
        .label { font-size: 11px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
        .label.ai { color: var(--neon); }
        .label.user { color: #777; }

        /* БЛОКИ КОДА */
        .code-container { background: #000; border: 1px solid #333; border-radius: 8px; margin-top: 15px; overflow: hidden; font-family: 'Consolas', monospace; }
        .code-header { background: #1a1a1a; padding: 8px 15px; font-size: 11px; color: var(--neon); display: flex; justify-content: space-between; border-bottom: 1px solid #222; }
        .code-body { padding: 15px; overflow-x: auto; color: #adbac7; white-space: pre; font-size: 13px; line-height: 1.5; }

        /* ВВОД */
        #input-wrap { padding: 20px; border-top: 1px solid #222; background: #0d0d0d; }
        input { width: 100%; background: #111; border: 1px solid #333; color: var(--neon); padding: 15px; outline: none; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        input:focus { border-color: var(--neon); }

        /* ВЬЮПОРТ (САША ПО ЦЕНТРУ) */
        #viewport { flex: 1; position: relative; background: #000; }
        #run-button { 
            position: absolute; bottom: 30px; right: 30px; 
            padding: 15px 35px; background: var(--neon); color: #000; 
            border: none; font-weight: bold; cursor: pointer; border-radius: 8px; 
            display: none; box-shadow: 0 0 25px var(--neon); z-index: 100;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="side-panel">
    <div id="chat-flow"></div>
    <div id="input-wrap">
        <input type="text" id="userInput" placeholder="Спроси Сашу о чем угодно..." autocomplete="off">
    </div>
</div>

<div id="viewport">
    <button id="run-button" onclick="executeJS()">ЗАПУСТИТЬ ВИЗУАЛИЗАЦИЮ</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
    let scene, camera, renderer, sasha, currentJS = "";
    let isSpeaking = false, clock = new THREE.Clock();
    let mouthLevel = 1.0;
    const synth = window.speechSynthesis;

    function init3D() {
        scene = new THREE.Scene();
        // Камера настроена для вида "в лицо"
        camera = new THREE.PerspectiveCamera(40, (window.innerWidth - 450) / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 4.5); 
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth - 450, window.innerHeight);
        document.getElementById('viewport').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const pLight = new THREE.PointLight(var(--neon), 1);
        pLight.position.set(2, 2, 5);
        scene.add(pLight);

        // Загрузка Саши
        new THREE.GLTFLoader().load("SashaAI.glb", (gltf) => {
            sasha = gltf.scene;
            sasha.scale.set(1.6, 1.6, 1.6);
            sasha.position.set(0, -1.3, 0); // Позиция по центру
            sasha.rotation.y = 0; // Лицом к камере
            scene.add(sasha);
        }, undefined, (e) => console.log("Файл SashaAI.glb не найден. Ожидание подключения модели."));

        renderLoop();
    }

    function renderLoop() {
        requestAnimationFrame(renderLoop);
        const dt = clock.getElapsedTime();
        if (sasha) {
            // Реалистичное качание
            let bob = Math.sin(dt * 1.2) * 0.04;
            if (isSpeaking) {
                bob = Math.sin(dt * 6) * 0.08;
                mouthLevel = 1.0 + Math.abs(Math.sin(dt * 12)) * 0.35;
            } else {
                mouthLevel += (1.0 - mouthLevel) * 0.1;
            }
            sasha.position.y = -1.3 + bob;
            sasha.scale.y = 1.6 * mouthLevel;
        }
        renderer.render(scene, camera);
    }

    function speak(txt) {
        if (synth.speaking) synth.cancel();
        const msg = new SpeechSynthesisUtterance(txt);
        msg.lang = 'ru-RU';
        msg.pitch = 0.85;
        msg.onstart = () => isSpeaking = true;
        msg.onend = () => isSpeaking = false;
        synth.speak(msg);
    }

    // --- МОЗГ LLM (Логика ChatGPT) ---
    function processAI(query) {
        const q = query.toLowerCase();
        let lang = "javascript";
        let code = "";
        let response = "";

        // Имитация "умного" ответа
        if (q.includes("привет") || q.includes("кто ты")) {
            response = "Приветствую. Я Саша, твой персональный ИИ-узел. Я могу генерировать сложную геометрию, писать код на разных языках и помогать в обучении.";
            lang = "system";
            code = "// Статус: Онлайн\n// Модули: Активны";
        } 
        else if (q.includes("c#") || q.includes("си шарп")) {
            lang = "csharp";
            response = "Конечно. Для реализации объемной логики в Unity я подготовила структуру класса с поддержкой трансформаций.";
            code = `using UnityEngine;\n\npublic class SashaCore : MonoBehaviour {\n    [SerializeField] private float amplitude = 1.5f;\n    void Update() {\n        float y = Mathf.Sin(Time.time) * amplitude;\n        transform.position = new Vector3(0, y, 0);\n    }\n}`;
        }
        else if (q.includes("c++") || q.includes("плюс")) {
            lang = "cpp";
            response = "Запрос на C++ принят. Генерирую оптимизированный код для обработки данных в реальном времени.";
            code = `#include <iostream>\n#include <vector>\n\nint main() {\n    std::vector<std::string> log = {"Sasha", "AI", "Active"};\n    for(const auto& s : log) std::cout << s << " ";\n    return 0;\n}`;
        }
        else {
            // Генерация КРАСИВОГО JS кода (Объем и Красота)
            lang = "javascript";
            response = "Хорошо, я создаю сложную объемную структуру с неоновым материалом и динамическим вращением.";
            
            // Разные объекты для разнообразия
            const shapes = [
                `new THREE.TorusKnotGeometry(1, 0.3, 128, 32)`,
                `new THREE.IcosahedronGeometry(1.5, 0)`,
                `new THREE.OctahedronGeometry(1.5, 5)`
            ];
            const randomShape = shapes[Math.floor(Math.random() * shapes.length)];
            const color = q.includes("красн") ? "0xff4444" : "0x00f2ff";

            code = `const geometry = ${randomShape};\nconst material = new THREE.MeshPhongMaterial({ \n    color: ${color}, \n    shininess: 100, \n    emissive: 0x111111 \n});\nconst mesh = new THREE.Mesh(geometry, material);\nmesh.position.set(Math.random()*4-2, 1, Math.random()*2-4);\nscene.add(mesh);\n\n// Добавляем вращение\nfunction animateObj() {\n    mesh.rotation.x += 0.01;\n    mesh.rotation.y += 0.01;\n    requestAnimationFrame(animateObj);\n}\nanimateObj();`;
            
            currentJS = code;
            document.getElementById('run-button').style.display = 'block';
        }

        speak(response);
        addMessage('ai', response, code, lang);
    }

    function addMessage(sender, text, code = null, lang = "") {
        const flow = document.getElementById('chat-flow');
        const div = document.createElement('div');
        div.className = 'message';
        const label = `<div class="label ${sender}">${sender === 'user' ? 'Вы' : 'Саша'}</div>`;
        let codeBlock = "";
        if (code) {
            codeBlock = `<div class="code-container"><div class="code-header"><span>${lang.toUpperCase()}</span><span>COPY</span></div><div class="code-body">${escape(code)}</div></div>`;
        }
        div.innerHTML = `${label}<div>${text}</div>${codeBlock}`;
        flow.appendChild(div);
        flow.scrollTop = flow.scrollHeight;
    }

    function escape(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    function executeJS() {
        try {
            const f = new Function('scene', 'THREE', currentJS);
            f(scene, THREE);
            document.getElementById('run-button').style.display = 'none';
        } catch(e) { console.error(e); }
    }

    document.getElementById('userInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && e.target.value) {
            const p = e.target.value;
            addMessage('user', p);
            processAI(p);
            e.target.value = '';
        }
    });

    window.onload = init3D;
</script>
</body>
</html>
