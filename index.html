<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Sasha Engine | 3D Core</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { background: #000; color: #00ff41; font-family: 'Consolas', monospace; margin: 0; overflow: hidden; }
        #container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* Интерфейс поверх 3D */
        .ui-layer { position: relative; z-index: 10; pointer-events: none; display: flex; flex-direction: column; height: 100vh; padding: 20px; box-sizing: border-box; }
        .code-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-top: auto; pointer-events: auto; }
        .code-block { background: rgba(0,0,0,0.8); border: 1px solid #00ff41; padding: 10px; height: 150px; overflow-y: auto; font-size: 11px; }
        
        .input-area { width: 500px; margin: 20px auto; pointer-events: auto; background: rgba(0,0,0,0.9); border: 2px solid #00ff41; padding: 15px; box-shadow: 0 0 20px #00ff41; }
        input { width: 70%; background: transparent; border: 1px solid #00ff41; color: #00ff41; padding: 8px; outline: none; }
        button { width: 25%; background: #00ff41; color: #000; border: none; padding: 9px; cursor: pointer; font-weight: bold; }
        
        .header { text-align: center; font-size: 24px; text-shadow: 0 0 10px #00ff41; pointer-events: none; }
    </style>
</head>
<body>

<div id="container"></div>

<div class="ui-layer">
    <div class="header">SASHA ENGINE: 3D VIZUALIZER</div>
    
    <div class="input-area">
        <input type="text" id="cmd" placeholder="Напиши: красный куб / синяя сфера..." onkeypress="if(event.key==='Enter') executeTask()">
        <button onclick="executeTask()">СОЗДАТЬ</button>
    </div>

    <div class="code-grid">
        <div class="code-block" title="JS Logic"><strong>JS:</strong><div id="js-out"></div></div>
        <div class="code-block" title="C++ Logic"><strong>C++:</strong><div id="cpp-out"></div></div>
        <div class="code-block" title="C# Logic"><strong>C#:</strong><div id="cs-out"></div></div>
    </div>
</div>

<script>
    // --- 3D ENGINE SETUP ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('container').appendChild(renderer.domElement);

    const light = new THREE.PointLight(0xffffff, 1, 100);
    light.position.set(10, 10, 10);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));
    camera.position.z = 5;

    let currentMesh;

    function animate() {
        requestAnimationFrame(animate);
        if(currentMesh) {
            currentMesh.rotation.x += 0.01;
            currentMesh.rotation.y += 0.01;
        }
        renderer.render(scene, camera);
    }
    animate();

    // --- LOGIC ---
    const voices = ["Модель загружена", "Объект на сцене", "Визуализация готова", "Принято, строю геометрию"];

    function executeTask() {
        const val = document.getElementById('cmd').value.toLowerCase();
        if(!val) return;

        // Удаляем старое
        if(currentMesh) scene.remove(currentMesh);

        // Параметры
        let colorStr = val.includes("красн") ? "red" : (val.includes("син") ? "blue" : "green");
        let colorHex = val.includes("красн") ? 0xff0000 : (val.includes("син") ? 0x0000ff : 0x00ff00);
        
        let geometry;
        let type = "Cube";
        if(val.includes("сфер")) {
            geometry = new THREE.SphereGeometry(1.5, 32, 32);
            type = "Sphere";
        } else {
            geometry = new THREE.BoxGeometry(2, 2, 2);
        }

        const material = new THREE.MeshStandardMaterial({ color: colorHex, wireframe: val.includes("сетка") });
        currentMesh = new THREE.Mesh(geometry, material);
        scene.add(currentMesh);

        // Код и Голос
        updateCode(type, colorStr);
        speak(voices[Math.floor(Math.random() * voices.length)]);
        document.getElementById('cmd').value = "";
    }

    function updateCode(obj, col) {
        document.getElementById('js-out').innerText = `new THREE.Mesh(\n  new THREE.${obj}Geometry(),\n  new THREE.MeshStandardMaterial({color: '${col}'})\n);`;
        document.getElementById('cpp-out').innerText = `// C++ / OpenGL\nglColor3f(${col === 'red' ? '1,0,0' : '0,1,0'});\ndraw${obj}();`;
        document.getElementById('cs-out').innerText = `// C# / Unity\nvar obj = GameObject.CreatePrimitive(PrimitiveType.${obj});\nobj.GetComponent<Renderer>().material.color = Color.${col};`;
    }

    function speak(text) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ru-RU';
        window.speechSynthesis.speak(msg);
    }
</script>
</body>
</html>
