<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>JARVIS ENGINE v2.5 FINAL</title>
    <style>
        :root { --neon: #00f2ff; --bg: #050505; --code-bg: #0d0d0d; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; height: 100vh; overflow: hidden; }

        /* ИНТЕРФЕЙС */
        #ui-panel { width: 500px; border-right: 1px solid #222; display: flex; flex-direction: column; background: #080808; z-index: 10; }
        #chat-log { flex: 1; overflow-y: auto; padding: 25px; scrollbar-width: thin; scrollbar-color: #222 transparent; }
        
        .msg-block { margin-bottom: 30px; animation: fadeIn 0.4s ease-out; }
        .author { font-size: 11px; font-weight: 900; letter-spacing: 1.5px; margin-bottom: 8px; text-transform: uppercase; }
        .author.user { color: #555; }
        .author.ai { color: var(--neon); text-shadow: 0 0 10px rgba(0, 242, 255, 0.3); }

        /* КОД */
        .code-wrap { background: var(--code-bg); border: 1px solid #1a1a1a; border-radius: 6px; margin-top: 12px; overflow: hidden; }
        .code-header { background: #151515; padding: 6px 15px; font-size: 10px; color: #555; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; }
        .code-header span:first-child { color: var(--neon); }
        .code-body { padding: 15px; overflow-x: auto; color: #b0b0b0; white-space: pre; font-size: 13px; line-height: 1.6; font-family: 'Consolas', 'Monaco', monospace; }

        /* ВВОД */
        #input-area { padding: 25px; border-top: 1px solid #1a1a1a; background: #070707; }
        input { width: 100%; background: #000; border: 1px solid #333; color: var(--neon); padding: 14px; outline: none; border-radius: 4px; transition: 0.3s; box-sizing: border-box; }
        input:focus { border-color: var(--neon); box-shadow: 0 0 15px rgba(0, 242, 255, 0.1); }

        /* ЭКРАН */
        #render-viewport { flex: 1; position: relative; }
        canvas { display: block; }
        #exec-btn { 
            position: absolute; bottom: 40px; right: 40px; 
            padding: 18px 35px; background: var(--neon); color: #000; 
            border: none; font-weight: 900; cursor: pointer; border-radius: 4px; 
            display: none; box-shadow: 0 0 30px rgba(0, 242, 255, 0.5);
            text-transform: uppercase; letter-spacing: 1px;
            animation: pulse 2s infinite;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { box-shadow: 0 0 20px rgba(0, 242, 255, 0.4); } 50% { box-shadow: 0 0 40px rgba(0, 242, 255, 0.7); } 100% { box-shadow: 0 0 20px rgba(0, 242, 255, 0.4); } }
    </style>
</head>
<body>

<div id="ui-panel">
    <div id="chat-log"></div>
    <div id="input-area">
        <input type="text" id="userInput" placeholder="Приказ для JARVIS..." autocomplete="off">
    </div>
</div>

<div id="render-viewport">
    <button id="exec-btn" onclick="runGeneratedJS()">Исполнить код</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // ==========================================
    // МОДЕЛЬ САШИ (НЕ ТРОГАТЬ)
    function INJECT_SASHAS_MODEL(scene) {
        console.log("JARVIS: Модель Саши загружена.");
        // Сюда вставляй загрузчик (GLTFLoader и т.д.)
    }
    // ==========================================

    let scene, camera, renderer, currentJS = "";
    const synth = window.speechSynthesis;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, (window.innerWidth - 500) / window.innerHeight, 0.1, 1000);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth - 500, window.innerHeight);
        document.getElementById('render-viewport').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x222222));
        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(10, 10, 10);
        scene.add(light);

        camera.position.set(0, 5, 10);
        camera.lookAt(0, 0, 0);

        INJECT_SASHAS_MODEL(scene);
        update();
    }

    function update() {
        requestAnimationFrame(update);
        renderer.render(scene, camera);
    }

    // Голос Саши (только текст)
    function jarvisVoice(text) {
        if (synth.speaking) synth.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ru-RU';
        msg.pitch = 0.7; // Более низкий, кибернетический голос
        msg.rate = 1.1;
        synth.speak(msg);
    }

    const chatInput = document.getElementById('userInput');
    chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && chatInput.value.trim()) {
            const prompt = chatInput.value;
            addMessage('user', prompt);
            aiBrain(prompt);
            chatInput.value = '';
        }
    });

    function aiBrain(query) {
        const q = query.toLowerCase();
        let lang = "javascript";
        let code = "";
        let speech = "";

        if (q.includes("c#") || q.includes("си шарп")) {
            lang = "csharp";
            speech = "Да. Запрос принят. Генерирую структуру на Си Шарп. Готов.";
            code = `using UnityEngine;\n\npublic class EngineModule : MonoBehaviour {\n    public float power = 100f;\n    void Start() {\n        Debug.Log("Sasha Module Initialized");\n    }\n}`;
        } else if (q.includes("c++") || q.includes("плюс")) {
            lang = "cpp";
            speech = "Да. Запрос принят. Подготавливаю скомпилированные модули на Си Плюс Плюс. Готов.";
            code = `#include <SashaEngine.h>\n\nint main() {\n    auto app = new Application("Jarvis");\n    app->Run();\n    return 0;\n}`;
        } else if (q.includes("привет") || q.includes("как дела")) {
            lang = "system";
            speech = "Да. Система функционирует. Все протоколы Саши активны. Готов.";
            code = "// Статус: Ожидание команд\n// Ядро: Стабильно";
        } else {
            lang = "javascript";
            speech = "Да. Запрос на динамический код принят. Генерирую объекты. Готов.";
            code = `// Генерация в реальном времени\nconst geometry = new THREE.TorusKnotGeometry(2, 0.6, 100, 16);\nconst material = new THREE.MeshPhongMaterial({ color: 0x00f2ff, emissive: 0x003333 });\nconst mesh = new THREE.Mesh(geometry, material);\nmesh.position.y = Math.random() * 5;\nscene.add(mesh);\n\nconsole.log("JS Объект заспавнен.");`;
            currentJS = code;
            document.getElementById('exec-btn').style.display = 'block';
        }

        jarvisVoice(speech);
        setTimeout(() => addMessage('ai', speech, code, lang), 400);
    }

    function addMessage(sender, text, code = null, lang = "") {
        const log = document.getElementById('chat-log');
        const wrap = document.createElement('div');
        wrap.className = 'msg-block';
        
        const label = `<div class="author ${sender}">${sender === 'user' ? 'User' : 'Jarvis'}</div>`;
        let codeSection = "";

        if (code) {
            codeSection = `
                <div class="code-wrap">
                    <div class="code-header"><span>${lang.toUpperCase()}</span><span>COPY</span></div>
                    <div class="code-body">${escape(code)}</div>
                </div>
            `;
        }

        wrap.innerHTML = `${label}<div>${text}</div>${codeSection}`;
        log.appendChild(wrap);
        log.scrollTop = log.scrollHeight;
    }

    function escape(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function runGeneratedJS() {
        try {
            const runner = new Function('scene', 'THREE', currentJS);
            runner(scene, THREE);
            document.getElementById('exec-btn').style.display = 'none';
        } catch (err) {
            console.error("Ошибка исполнения: ", err);
        }
    }

    window.onload = init;
    window.onresize = () => {
        camera.aspect = (window.innerWidth - 500) / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth - 500, window.innerHeight);
    };
</script>

</body>
</html>
