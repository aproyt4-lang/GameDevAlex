<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Sasha Engine | Home Base</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
        #viewport { position: absolute; width: 100%; height: 100%; }
        .ui-overlay { position: absolute; z-index: 10; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        .terminal { background: rgba(0, 20, 0, 0.8); border: 1px solid #00ff41; color: #00ff41; margin: 10px; padding: 10px; pointer-events: auto; }
        .panels { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 10px; }
        .code-box { background: #050505; border: 1px solid #444; height: 150px; overflow: auto; font-size: 12px; padding: 5px; }
        .input-line { display: flex; background: #000; padding: 15px; border-top: 2px solid #00ff41; pointer-events: auto; }
        input { flex: 1; background: #000; border: 1px solid #00ff41; color: #00ff41; padding: 10px; outline: none; }
        button { background: #00ff41; color: #000; border: none; padding: 10px 30px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="viewport"></div>

<div class="ui-overlay">
    <div class="terminal" style="text-align:center; font-weight:bold;">SASHA ENGINE | ОБЪЕКТ: САША | СТАТУС: НА БАЗЕ</div>
    
    <div class="panels">
        <div class="code-box"><strong>JS EXEC:</strong><pre id="js-out"></pre></div>
        <div class="code-box"><strong>C++ CORE:</strong><pre id="cpp-out"></pre></div>
        <div class="code-box"><strong>C# ENGINE:</strong><pre id="cs-out"></pre></div>
    </div>

    <div class="input-line">
        <input type="text" id="cmd" placeholder="Приказ для Саши...">
        <button onclick="sendOrder()">ОТПРАВИТЬ</button>
    </div>
</div>

<script>
    // 1. Инициализация сцены
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('viewport').appendChild(renderer.domElement);

    // 2. Свет (чтобы Сашу было видно)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0x00ff41, 1);
    dirLight.position.set(5, 5, 5);
    scene.add(dirLight);

    camera.position.set(0, 1.5, 5); // Позиция "лицом к лицу"

    let sashaModel;

    // 3. ЗАГРУЗКА МОДЕЛИ САШИ
    const loader = new THREE.GLTFLoader();
    // ЗАМЕНИ 'sasha_model.glb' на реальное имя твоего файла
    loader.load('sasha_model.glb', function (gltf) {
        sashaModel = gltf.scene;
        scene.add(sashaModel);
        console.log("Саша на базе.");
    }, undefined, function (error) {
        console.error("Файл sasha_model.glb не найден. Использую временный макет.");
        // Фантом Саши (если файл не найден)
        const geometry = new THREE.CylinderGeometry(0.5, 0.5, 2, 32);
        const material = new THREE.MeshStandardMaterial({ color: 0x00ff41, wireframe: true });
        sashaModel = new THREE.Mesh(geometry, material);
        scene.add(sashaModel);
    });

    function animate() {
        requestAnimationFrame(animate);
        if(sashaModel) sashaModel.rotation.y += 0.005;
        renderer.render(scene, camera);
    }
    animate();

    // 4. Логика приказов
    const phrases = ["Сделаю", "Саша слушает", "Приказ принят", "Обновляю протоколы"];

    function sendOrder() {
        const val = document.getElementById('cmd').value;
        if(!val) return;

        // Голос
        const msg = new SpeechSynthesisUtterance(phrases[Math.floor(Math.random()*phrases.length)]);
        msg.lang = 'ru-RU';
        window.speechSynthesis.speak(msg);

        // Генерация кода
        document.getElementById('js-out').innerText = `sasha.action("${val}");`;
        document.getElementById('cpp-out').innerText = `void OnCommand() {\n  Sasha->Execute("${val}");\n}`;
        document.getElementById('cs-out').innerText = `public void Task() {\n  sasha.Do("${val}");\n}`;
        
        document.getElementById('cmd').value = "";
    }
</script>
</body>
</html>
