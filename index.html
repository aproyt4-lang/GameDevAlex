<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>SASHA ENGINE v6.0</title>
<style>
:root { --neon: #00f2ff; --bg: #020202; --panel: #080808; }
body { margin: 0; background: var(--bg); color: #fff; font-family: 'Courier New', monospace; display: flex; height: 100vh; overflow: hidden; }
#ai-core { width: 550px; background: var(--panel); border-right: 2px solid #1a1a1a; display: flex; flex-direction: column; }
#log-stream { flex: 1; overflow-y: auto; padding: 20px; font-size: 13px; line-height: 1.4; }
.entry { margin-bottom: 25px; border-left: 3px solid #222; padding-left: 15px; }
.entry.ai { border-left-color: var(--neon); }
.tag { font-size: 10px; font-weight: bold; color: var(--neon); margin-bottom: 5px; text-transform: uppercase; }
#input-container { padding: 20px; background: #050505; border-top: 1px solid #222; }
#prompt, #code { width: 100%; background: #000; border: 1px solid #444; color: var(--neon); padding: 10px; outline: none; border-radius: 4px; margin-bottom:5px; }
#viewport { flex: 1; position: relative; }
#execute-btn, #runBtn, #micBtn { position: absolute; bottom: 30px; padding: 10px 20px; background: var(--neon); color: #000; border:none; font-weight:900; cursor:pointer; box-shadow:0 0 20px var(--neon); }
#execute-btn { left:30px; display:none; }
#runBtn { left:200px; }
#micBtn { left:370px; }
iframe#sandbox { width:100%; height:150px; border:1px solid var(--neon); background:#000; margin-top:5px; }
</style>
</head>
<body>

<div id="ai-core">
    <div id="log-stream"></div>
    <div id="input-container">
        <input type="text" id="prompt" placeholder="Приказ (C++, C#, JS, GLSL)...">
        <textarea id="code" placeholder="JS код для sandbox"></textarea>
    </div>
</div>

<div id="viewport">
    <button id="execute-btn" onclick="runLogic()">EXECUTE_MODULE</button>
    <button id="runBtn">ИСПОЛНИТЬ КОД</button>
    <button id="micBtn">🎤</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
let scene, camera, renderer, sasha, clock = new THREE.Clock();
let speaking = false, codeToRun = "";
const voice = window.speechSynthesis;

// ====================== 3D INIT ======================
new THREE.GLTFLoader().load("SashaAI.glb", g => {
    sasha = g.scene;
    sasha.scale.set(1.8, 1.8, 1.8);
    sasha.position.y = -1.2;
    // Разворот лицом (подбери под свою модель)
    sasha.rotation.y = -Math.PI / 2; 
    scene.add(sasha);
    cam.position.set(0, 0, 5);
    animate();
});

    loop();
}
function loop(){
    requestAnimationFrame(loop);
    const t = clock.getElapsedTime();
    if(sasha){
        let bob = Math.sin(t*1.2)*0.05;
        if(speaking){
            bob = Math.sin(t*8)*0.1;
            sasha.scale.y = 1.6 + Math.abs(Math.sin(t*15))*0.3;
        } else sasha.scale.y = 1.6;
        sasha.position.y = -1.3 + bob;
    }
    renderer.render(scene,camera);
}

// ====================== VOICE ======================
function say(text){
    voice.cancel();
    const m = new SpeechSynthesisUtterance(text);
    m.lang = 'ru-RU'; m.pitch=0.8;
    m.onstart = ()=> speaking=true;
    m.onend = ()=> speaking=false;
    voice.speak(m);
}
function startListening(){
    const rec = new(window.SpeechRecognition||window.webkitSpeechRecognition)();
    rec.lang="ru-RU"; rec.start();
    rec.onresult = e=> process(e.results[0][0].transcript);
}

// ====================== STATES & AI ======================
const States = { idle(){}, thinking(){}, speaking(){}, happy(){}, angry(){}, sad(){}, curious(){}, excited(){}, sleepy(){}, defensive(){}, analyzing(){}, observing(){}, listening(){}, processing(){}, confused(){}, confident(){}, alert(){}, standby(){}, autonomous(){}, patrol(){}, protect(){}, debug(){}, creative(){}, logical(){}, focus(){}, relax(){}, threat(){}, shutdown(){}, reboot(){}, learning(){} };

class StateMachine{
    constructor(owner){ this.owner=owner; this.current="idle"; }
    set(state){ this.current=state; }
    update(){ States[this.current]?.(); }
}

class SashaAI{
    constructor(){ this.fsm=new StateMachine(this); setInterval(()=>this.autonomous(),5000); }
    process(input){
        input=input.toLowerCase();
        if(input.includes("привет")){
            this.fsm.set("happy"); setEmotion(0x00ffcc); say("Привет. Я активна.");
        } else if(input.includes("злой")){
            this.fsm.set("angry"); setEmotion(0xff0000); say("Я сердита.");
        }
    }
    autonomous(){
        const moods=["idle","observing","thinking","analyzing"];
        this.fsm.set(moods[Math.floor(Math.random()*moods.length)]);
    }
    update(){ this.fsm.update(); }
}
const ai = new SashaAI();

// ====================== EMOTION ======================
function setEmotion(color){
    if(!sasha) return;
    sasha.traverse(o=>{
        if(o.isMesh) o.material.color.set(color);
    });
}

// ====================== LOG ======================
function addEntry(type,text,code=""){
    const log = document.getElementById('log-stream');
    const div = document.createElement('div');
    div.className=`entry ${type==='user'?'user':'ai'}`;
    let codeHtml="";
    if(code) codeHtml=`<div style="background:#000;color:#88c6ff;padding:5px;margin-top:3px;white-space:pre;">${code}</div>`;
    div.innerHTML=`<div class="tag">${type==='user'?'Input':'Sasha Engine'}</div><div>${text}</div>${codeHtml}`;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
}

// ====================== PROCESS INPUT ======================
function process(val){
    addEntry('user',val);
    ai.process(val);
    let res = {l:"javascript", t:"Модуль обработан.", code:""};
    if(val.toLowerCase().includes("c++") || val.toLowerCase().includes("плюс")){
        res.l="cpp"; res.t="Развертывание C++ ядра"; res.code="/* C++ core */";
    } else if(val.toLowerCase().includes("c#") || val.toLowerCase().includes("шарп")){
        res.l="csharp"; res.t="Генерация C#"; res.code="/* C# core */";
    } else {
        res.l="javascript"; res.t="JS модуль"; res.code="/* JS module */";
        codeToRun=res.code; document.getElementById('execute-btn').style.display='block';
    }
    say(res.t);
    addEntry('ai',res.t,res.code);
}

// ====================== SANDBOX ======================
document.getElementById('runBtn').onclick=()=>{
    const code=document.getElementById('code').value;
    const blob=new Blob([`<html><body style="background:black;color:#0ff"><script>try{${code}}catch(e){document.body.innerHTML="<pre style='color:red'>"+e+"</pre>";}<\/script></body></html>`],{type:"text/html"});
    document.getElementById('sandbox').src=URL.createObjectURL(blob);
};

// ====================== EXECUTE MODULE ======================
function runLogic(){
    try{ new Function('scene','THREE',codeToRun)(scene,THREE); } catch(e){}
    document.getElementById('execute-btn').style.display='none';
}

// ====================== EVENTS ======================
document.getElementById('prompt').addEventListener('keypress',(e)=>{
    if(e.key==='Enter' && e.target.value.trim()){ process(e.target.value); e.target.value=''; }
});
document.getElementById('micBtn').onclick=startListening;

window.onload=init;
setInterval(()=>ai.update(),16);
</script>

<iframe id="sandbox" sandbox="allow-scripts"></iframe>
</body>
</html>
