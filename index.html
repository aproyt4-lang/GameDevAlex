<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SASHA ENGINE v5.0 - ULTIMATE</title>
    <style>
        :root { --neon: #00f2ff; --bg: #020202; --panel: #080808; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Courier New', monospace; display: flex; height: 100vh; overflow: hidden; }
        
        /* ЛЕВАЯ ПАНЕЛЬ: ИНТЕРФЕЙС ИИ */
        #ai-core { width: 550px; background: var(--panel); border-right: 2px solid #1a1a1a; display: flex; flex-direction: column; }
        #log-stream { flex: 1; overflow-y: auto; padding: 20px; font-size: 13px; line-height: 1.4; }
        .entry { margin-bottom: 25px; border-left: 3px solid #222; padding-left: 15px; }
        .entry.ai { border-left-color: var(--neon); }
        .tag { font-size: 10px; font-weight: bold; color: var(--neon); margin-bottom: 5px; text-transform: uppercase; }

        /* БЛОК ГЕНЕРАЦИИ КОДА */
        .code-block { background: #000; border: 1px solid #333; margin-top: 10px; position: relative; }
        .code-meta { background: #111; padding: 5px 10px; font-size: 10px; display: flex; justify-content: space-between; border-bottom: 1px solid #222; }
        .code-content { padding: 15px; overflow-x: auto; white-space: pre; color: #88c6ff; max-height: 500px; }

        /* ПОЛЕ ВВОДА */
        #input-container { padding: 20px; background: #050505; border-top: 1px solid #222; }
        #prompt { width: 100%; background: #000; border: 1px solid #444; color: var(--neon); padding: 15px; outline: none; border-radius: 4px; }

        /* ПРАВАЯ ЧАСТЬ: 3D ОКНО */
        #viewport { flex: 1; position: relative; }
        #execute-btn { position: absolute; bottom: 30px; left: 30px; padding: 15px 40px; background: var(--neon); color: #000; border: none; font-weight: 900; cursor: pointer; display: none; box-shadow: 0 0 20px var(--neon); }
    </style>
</head>
<body>

<div id="ai-core">
    <div id="log-stream"></div>
    <div id="input-container">
        <input type="text" id="prompt" placeholder="Приказ (C++, C#, JS, GLSL)..." autocomplete="off">
    </div>
</div>

<div id="viewport">
    <button id="execute-btn" onclick="runLogic()">EXECUTE_MODULE</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
    let scene, camera, renderer, sasha, codeToRun = "";
    let speaking = false, clock = new THREE.Clock();
    const voice = window.speechSynthesis;

    function init() {
        scene = new THREE.Scene();
        // Камера: лицо Саши на весь экран
        camera = new THREE.PerspectiveCamera(30, (window.innerWidth - 550) / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 4);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth - 550, window.innerHeight);
        document.getElementById('viewport').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        
        new THREE.GLTFLoader().load("SashaAI.glb", (g) => {
            sasha = g.scene;
            sasha.scale.set(1.6, 1.6, 1.6);
            sasha.position.set(0, -1.3, 0);
            scene.add(sasha);
        });

        loop();
    }

    function loop() {
        requestAnimationFrame(loop);
        const t = clock.getElapsedTime();
        if (sasha) {
            let bob = Math.sin(t * 1.2) * 0.05;
            if (speaking) {
                bob = Math.sin(t * 8) * 0.1;
                sasha.scale.y = 1.6 + Math.abs(Math.sin(t * 15)) * 0.3;
            } else {
                sasha.scale.y = 1.6;
            }
            sasha.position.y = -1.3 + bob;
        }
        renderer.render(scene, camera);
    }

    function say(text) {
        voice.cancel();
        const m = new SpeechSynthesisUtterance(text);
        m.lang = 'ru-RU'; m.pitch = 0.8;
        m.onstart = () => speaking = true;
        m.onend = () => speaking = false;
        voice.speak(m);
    }

    function process(val) {
        const q = val.toLowerCase();
        let res = { l: "javascript", c: "", t: "Модуль обработан." };

        if (q.includes("c++") || q.includes("плюс")) {
            res.l = "cpp";
            res.t = "Развертывание C++ ядра. Сгенерировано 40+ точек входа управления памятью и физикой.";
            res.code = `
#ifndef ENGINE_CORE_H
#define ENGINE_CORE_H

#include <iostream>
#include <vector>

namespace SashaCore {
    // 1. Memory Controller
    // 2. Thread Manager
    // 3. Entity Factory
    // ... [Ещё 37 пунктов логики]
    class Kernel {
    public:
        void Initialize() { 
            std::cout << "Kernel Online" << std::endl; 
        }
        void Update(float dt);
        void Shutdown();
    };
}
#endif`;
        } else if (q.includes("c#") || q.includes("си шарп")) {
            res.l = "csharp";
            res.t = "Генерация C# скрипта. Подключены системы NavMesh, Animator и StateMachine.";
            res.code = `
using UnityEngine;
using System.Collections;

public class SashaController : MonoBehaviour {
    // 1. AI Logic
    // 2. Physics Sync
    // 3. Event Bus
    void Start() { Debug.Log("System Active"); }
    void Update() { /* Logic Core */ }
}`;
        } else {
            res.l = "javascript";
            res.t = "Запуск динамического 3D модуля в текущем вьюпорте.";
            res.code = `
const geo = new THREE.TorusKnotGeometry(1, 0.3, 100, 16);
const mat = new THREE.MeshPhongMaterial({ color: 0x00f2ff, wireframe: true });
const mesh = new THREE.Mesh(geo, mat);
scene.add(mesh);
function rotate() { mesh.rotation.y += 0.02; requestAnimationFrame(rotate); }
rotate();`;
            codeToRun = res.code;
            document.getElementById('execute-btn').style.display = 'block';
        }

        say(res.t);
        addEntry('ai', res.t, res.code, res.l);
    }

    function addEntry(type, text, code = null, lang = "") {
        const log = document.getElementById('log-stream');
        const div = document.createElement('div');
        div.className = `entry ${type}`;
        let codeHtml = "";
        if (code) {
            codeHtml = `<div class="code-block"><div class="code-meta"><b>${lang.toUpperCase()}</b></div><div class="code-content">${code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div></div>`;
        }
        div.innerHTML = `<div class="tag">${type === 'user' ? 'Input' : 'Sasha Engine'}</div><div>${text}</div>${codeHtml}`;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
    }

    function runLogic() {
        try { new Function('scene', 'THREE', codeToRun)(scene, THREE); } catch(e) {}
        document.getElementById('execute-btn').style.display = 'none';
    }

    document.getElementById('prompt').addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && e.target.value.trim()) {
            addEntry('user', e.target.value);
            process(e.target.value);
            e.target.value = '';
        }
    });

    window.onload = init;
</script>
</body>
</html>
