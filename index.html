<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>SASHA ENGINE v6.2</title>
<style>
:root { --neon:#00f2ff; --bg:#020202; --panel:#080808; }
body{margin:0;background:var(--bg);color:#fff;font-family:'Courier New',monospace;display:flex;height:100vh;overflow:hidden;}
#ai-core{width:550px;background:var(--panel);border-right:2px solid #1a1a1a;display:flex;flex-direction:column;}
#log-stream{flex:1;overflow-y:auto;padding:20px;font-size:13px;line-height:1.4;}
.entry{margin-bottom:25px;border-left:3px solid #222;padding-left:15px;}
.entry.ai{border-left-color:var(--neon);}
.tag{font-size:10px;font-weight:bold;color:var(--neon);margin-bottom:5px;text-transform:uppercase;}
#input-container{padding:20px;background:#050505;border-top:1px solid #222;}
#prompt,#code{width:100%;background:#000;border:1px solid #444;color:var(--neon);padding:10px;outline:none;border-radius:4px;margin-bottom:5px;}
#viewport{flex:1;position:relative;}
#execute-btn,#runBtn,#micBtn{position:absolute;bottom:30px;padding:10px 20px;background:var(--neon);color:#000;border:none;font-weight:900;cursor:pointer;box-shadow:0 0 20px var(--neon);}
#execute-btn{left:30px;display:none;}
#runBtn{left:200px;}
#micBtn{left:370px;}
iframe#sandbox{width:100%;height:150px;border:1px solid var(--neon);background:#000;margin-top:5px;}
</style>
</head>
<body>

<div id="ai-core">
  <div id="log-stream"></div>
  <div id="input-container">
    <input type="text" id="prompt" placeholder="Приказ (C++, C#, JS, GLSL)...">
    <textarea id="code" placeholder="JS код для sandbox"></textarea>
  </div>
</div>

<div id="viewport">
  <button id="execute-btn" onclick="Engine.runModule()">EXECUTE_MODULE</button>
  <button id="runBtn">ИСПОЛНИТЬ КОД</button>
  <button id="micBtn">🎤</button>
</div>

<iframe id="sandbox" sandbox="allow-scripts"></iframe>

<script type="module">
import * as THREE from 'https://cdn.skypack.dev/three@0.128.0';
import { GLTFLoader } from 'https://cdn.skypack.dev/three@0.128.0/examples/jsm/loaders/GLTFLoader.js';

/* ================= MODEL (НЕ ТРОГАЕМ ЛОГИКУ) ================= */
class Model {
  constructor(scene){
    this.scene = scene;
    this.model = null;
    this.mixer = null;
  }

load("SashaAI.glb")
  {
      this.model = gltf.scene;
      this.scene.add(this.model);
      this.model.scale.set(1.5,1.5,1.5);
      this.model.position.set(0,-1.2,0);
      this.model.rotation.y = -Math.PI/2;

      if(gltf.animations.length)
      {
        this.mixer = new THREE.AnimationMixer(this.model);
        const action = this.mixer.clipAction(gltf.animations[0]);
        action.play();
      }
  }
    undefined, err=>{
      console.error("Ошибка загрузки модели:", err);
    }
update(dt){ if(this.mixer) this.mixer.update(dt); }
setEmotion(color){
    if(!this.model) return;
    this.model.traverse(o=>{
      if(o.isMesh && o.material?.color){
        o.material.color.set(color);
      }
    });
  }
}

/* ================= STATE MACHINE ================= */
class StateMachine{
  constructor(){ this.current="idle"; }
  set(s){ this.current=s; }
}

/* ================= AI ================= */
class AI {
  constructor(engine){
    this.engine = engine;
    this.memory = [];
    this.lastIntent = null;
  }

  process(input){
    if(!input || !input.trim()) return;

    const raw = input;
    const text = input.toLowerCase().trim();
    this.memory.push(raw);

    // === ЭМОЦИИ ===
    if(this.has(text, ["привет","здравств","хай"])){
      this.engine.Model.setEmotion(0x00ffcc);
      this.engine.say("Я активен.");
      return;
    }

    if(this.has(text, ["злой","гнев","агресс"])){
      this.engine.Model.setEmotion(0xff0000);
      this.engine.say("Режим агрессии активирован.");
      return;
    }

    // === СОЗДАНИЕ ОБЪЕКТОВ ===
    if(this.has(text, ["создай","добав","постав","сделай"])){
      this.createFromText(text);
      return;
    }

    // === УПРАВЛЕНИЕ СЦЕНОЙ ===
    if(this.has(text, ["очист","удали всё","сброс"])){
      this.clearScene();
      return;
    }

    if(this.has(text, ["поверн","вращай"])){
      this.engine.scene.rotation.y += 0.5;
      this.engine.say("Сцена повернута.");
      return;
    }

    // === ГЕНЕРАЦИЯ КОДА ===
    if(this.has(text, ["c++","плюс плюс"])){
      this.generateCPP(raw);
      return;
    }

    if(this.has(text, ["c#","шарп"])){
      this.generateCS(raw);
      return;
    }

    if(this.has(text, ["js","javascript","код"])){
      this.generateJS(raw);
      return;
    }

    // === ЕСЛИ НИЧЕГО НЕ НАШЛО ===
    this.engine.say("Запрос принят. Анализирую.");
  }

  has(text, variants){
    return variants.some(v => text.includes(v));
  }

  clearScene(){
    this.engine.scene.children
      .filter(o=>o.isMesh)
      .forEach(o=>this.engine.scene.remove(o));
    this.engine.say("Сцена очищена.");
  }

  createFromText(text){
    const shapes = {
      "куб": ()=> new THREE.BoxGeometry(1,1,1),
      "сфера": ()=> new THREE.SphereGeometry(0.7,32,32),
      "конус": ()=> new THREE.ConeGeometry(0.5,1,32),
      "цилиндр": ()=> new THREE.CylinderGeometry(0.5,0.5,1,32),
      "тор": ()=> new THREE.TorusGeometry(0.5,0.2,16,100),
      "плоск": ()=> new THREE.PlaneGeometry(3,3)
    };

    let geometry = null;

    for(const key in shapes){
      if(text.includes(key)){
        geometry = shapes[key]();
        break;
      }
    }

    if(!geometry){
      geometry = new THREE.BoxGeometry(1,1,1);
    }

    const material = new THREE.MeshStandardMaterial({
      color: Math.random()*0xffffff
    });

    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(
      Math.random()*4-2,
      0,
      Math.random()*4-2
    );

    this.engine.scene.add(mesh);
    this.engine.say("Объект создан.");
  }

  generateJS(task){
    const code =
`// Сгенерировано по запросу: ${task}

const obj = new THREE.Mesh(
  new THREE.BoxGeometry(1,1,1),
  new THREE.MeshStandardMaterial({color: Math.random()*0xffffff})
);

obj.position.y = 1;
scene.add(obj);`;

    document.getElementById("code").value = code;
    this.engine.say("JS код создан. Нажми ИСПОЛНИТЬ КОД.");
  }

  generateCPP(task){
    const code =
`// C++ по запросу: ${task}

#include <iostream>
using namespace std;

int main(){
  cout << "Sasha Engine" << endl;
  return 0;
}`;

    document.getElementById("code").value = code;
    this.engine.say("C++ код создан.");
  }

  generateCS(task){
    const code =
`// C# по запросу: ${task}

using System;

class Program{
  static void Main(){
    Console.WriteLine("Sasha Engine");
  }
}`;

    document.getElementById("code").value = code;
    this.engine.say("C# код создан.");
  }
}
/* ================= ENGINE ================= */
const Engine={
  scene:null,
  camera:null,
  renderer:null,

  init(scene,camera,renderer){
    this.scene=scene;
    this.camera=camera;
    this.renderer=renderer;

    this.Model=new Model(scene);
    this.AI=new AI(this);

    this.Model.load();
    this.loop();
  },

  loop(){
    this.Model.update(0.016);
    this.renderer.render(this.scene,this.camera);
    requestAnimationFrame(()=>this.loop());
  },

  handleInput(text){ this.AI.process(text); },

  say(text){
    const log=document.getElementById("log-stream");
    log.innerHTML+=`<div class="entry ai"><div class="tag">Sasha Engine</div>${text}</div>`;
    const u=new SpeechSynthesisUtterance(text);
    u.lang="ru-RU";
    speechSynthesis.speak(u);
  }
};

/* ================= SCENE ================= */
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(30,(window.innerWidth-550)/window.innerHeight,0.1,1000);
camera.position.set(0,0,4);

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(window.innerWidth-550,window.innerHeight);
document.getElementById('viewport').appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,1.2));

Engine.init(scene,camera,renderer);

/* ================= INPUT ================= */
document.getElementById('prompt').addEventListener('keydown',e=>{
  if(e.key==="Enter"){
    Engine.handleInput(e.target.value);
    e.target.value="";
  }
});

/* ================= SANDBOX ================= */
document.getElementById('runBtn').onclick=()=>{
  const code=document.getElementById("code").value;
  try{
    new Function("scene","THREE",code)(scene,THREE);
    Engine.say("JS выполнен.");
  }catch(err){
    Engine.say("Ошибка: "+err.message);
  }
};
</script>
</body>
</html>
