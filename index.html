<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SASHA AI - ULTIMATE CORE</title>
    <style>
        :root { --neon: #00f2ff; --bg: #050505; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }

        /* ИНТЕРФЕЙС CHAT GPT STYLE */
        #chat-side { width: 480px; background: #080808; border-right: 1px solid #222; display: flex; flex-direction: column; z-index: 10; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; scrollbar-width: thin; }
        
        .msg { margin-bottom: 25px; animation: fadeIn 0.3s ease; }
        .label { font-size: 10px; font-weight: bold; letter-spacing: 2px; margin-bottom: 8px; text-transform: uppercase; }
        .label.ai { color: var(--neon); }
        .label.user { color: #555; }

        /* БЛОКИ КОДА */
        .code-box { background: #000; border: 1px solid #333; border-radius: 8px; margin-top: 10px; overflow: hidden; }
        .code-header { background: #151515; padding: 6px 15px; font-size: 11px; color: var(--neon); border-bottom: 1px solid #222; display: flex; justify-content: space-between; }
        .code-content { padding: 15px; overflow-x: auto; color: #ccc; white-space: pre; font-size: 13px; line-height: 1.5; font-family: 'Consolas', monospace; }

        /* ВВОД */
        #input-zone { padding: 20px; border-top: 1px solid #222; }
        input { width: 100%; background: #000; border: 1px solid #333; color: var(--neon); padding: 12px; outline: none; border-radius: 6px; box-sizing: border-box; }
        input:focus { border-color: var(--neon); }

        /* 3D VIEWPORT */
        #viewport { flex: 1; position: relative; }
        #exec-btn { position: absolute; bottom: 30px; right: 30px; padding: 15px 30px; background: var(--neon); color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; display: none; box-shadow: 0 0 20px var(--neon); }
    </style>
</head>
<body>

<div id="chat-side">
    <div id="messages"></div>
    <div id="input-zone">
        <input type="text" id="userInput" placeholder="Напиши Саше..." autocomplete="off">
    </div>
</div>

<div id="viewport">
    <button id="exec-btn" onclick="runJS()">ЗАПУСТИТЬ ОБЪЕКТ</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
    let scene, camera, renderer, sasha, currentJS = "";
    let isSpeaking = false, clock = new THREE.Clock();
    const synth = window.speechSynthesis;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(40, (window.innerWidth - 480) / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 4.5); // Лицом к Саше

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth - 480, window.innerHeight);
        document.getElementById('viewport').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.5));
        
        // Загрузка Саши
        new THREE.GLTFLoader().load("SashaAI.glb", (g) => {
            sasha = g.scene;
            sasha.scale.set(1.6, 1.6, 1.6);
            sasha.position.set(0, -1.3, 0);
            scene.add(sasha);
        });

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        if (sasha) {
            let bob = Math.sin(t * 1.5) * 0.04;
            if (isSpeaking) {
                bob = Math.sin(t * 6) * 0.08;
                sasha.scale.y = 1.6 + Math.abs(Math.sin(t * 12)) * 0.3; // Рот
            } else {
                sasha.scale.y = 1.6;
            }
            sasha.position.y = -1.3 + bob;
        }
        renderer.render(scene, camera);
    }

    function speak(txt) {
        if (synth.speaking) synth.cancel();
        const u = new SpeechSynthesisUtterance(txt);
        u.lang = 'ru-RU'; u.pitch = 0.8;
        u.onstart = () => isSpeaking = true;
        u.onend = () => isSpeaking = false;
        synth.speak(u);
    }

    // --- МОЗГ ГЕНЕРАЦИИ (БЕЗ ОШИБОК) ---
    function aiBrain(query) {
        const q = query.toLowerCase();
        let lang = "javascript";
        let code = "";
        let response = "Запрос обработан. Генерирую структуру...";

        if (q.includes("c#") || q.includes("си шарп")) {
            lang = "csharp";
            response = "Да. Вот тебе рабочий скрипт на C# для Unity. Я настроила логику вращения и трансформации.";
            code = `using UnityEngine;\n\npublic class SashaBehavior : MonoBehaviour {\n    public float speed = 10.0f;\n    void Update() {\n        transform.Rotate(Vector3.up * speed * Time.deltaTime);\n    }\n}`;
        } 
        else if (q.includes("c++") || q.includes("плюс")) {
            lang = "cpp";
            response = "Принято. Генерирую код на C++. Оптимизирую заголовочные файлы для твоего проекта.";
            code = `#include <iostream>\n\nint main() {\n    std::cout << "Sasha Engine v3.0 Active" << std::endl;\n    return 0;\n}`;
        } 
        else {
            lang = "javascript";
            response = "Хорошо. Создаю визуальный объект с использованием Three.js. Нажми кнопку для запуска.";
            
            // Генерация случайной "красоты"
            const types = ["TorusKnotGeometry(1, 0.3, 128, 32)", "IcosahedronGeometry(1.5, 0)", "SphereGeometry(1.2, 32, 32)"];
            const colors = ["0x00f2ff", "0xff0055", "0x00ff99"];
            const chosenType = types[Math.floor(Math.random()*types.length)];
            const chosenColor = colors[Math.floor(Math.random()*colors.length)];

            code = `const geo = new THREE.${chosenType};\nconst mat = new THREE.MeshPhongMaterial({ color: ${chosenColor}, wireframe: ${Math.random() > 0.5} });\nconst m = new THREE.Mesh(geo, mat);\nm.position.y = 1;\nscene.add(m);\n\nfunction rot() { m.rotation.y += 0.02; requestAnimationFrame(rot); }\nrot();`;
            
            currentJS = code;
            document.getElementById('exec-btn').style.display = 'block';
        }

        speak(response);
        addMsg('ai', response, code, lang);
    }

    function addMsg(sender, text, code = null, lang = "") {
        const box = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = 'msg';
        const label = `<div class="label ${sender}">${sender === 'user' ? 'Вы' : 'Саша'}</div>`;
        let codeHtml = "";
        if (code) {
            codeHtml = `<div class="code-box"><div class="code-header"><span>${lang.toUpperCase()}</span></div><div class="code-content">${text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"), code}</div></div>`;
        }
        div.innerHTML = `${label}<div>${text}</div>${codeHtml}`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function runJS() {
        try {
            const f = new Function('scene', 'THREE', currentJS);
            f(scene, THREE);
            document.getElementById('exec-btn').style.display = 'none';
        } catch(e) { console.error(e); }
    }

    document.getElementById('userInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && e.target.value) {
            addMsg('user', e.target.value);
            aiBrain(e.target.value);
            e.target.value = '';
        }
    });

    window.onload = init;
</script>
</body>
</html>
