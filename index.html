<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>SASHA ENGINE v6.1</title>
<style>
:root { --neon:#00f2ff; --bg:#020202; --panel:#080808; }
body{margin:0;background:var(--bg);color:#fff;font-family:'Courier New',monospace;display:flex;height:100vh;overflow:hidden;}
#ai-core{width:550px;background:var(--panel);border-right:2px solid #1a1a1a;display:flex;flex-direction:column;}
#log-stream{flex:1;overflow-y:auto;padding:20px;font-size:13px;line-height:1.4;}
.entry{margin-bottom:25px;border-left:3px solid #222;padding-left:15px;}
.entry.ai{border-left-color:var(--neon);}
.tag{font-size:10px;font-weight:bold;color:var(--neon);margin-bottom:5px;text-transform:uppercase;}
#input-container{padding:20px;background:#050505;border-top:1px solid #222;}
#prompt,#code{width:100%;background:#000;border:1px solid #444;color:var(--neon);padding:10px;outline:none;border-radius:4px;margin-bottom:5px;}
#viewport{flex:1;position:relative;}
#execute-btn,#runBtn,#micBtn{position:absolute;bottom:30px;padding:10px 20px;background:var(--neon);color:#000;border:none;font-weight:900;cursor:pointer;box-shadow:0 0 20px var(--neon);}
#execute-btn{left:30px;display:none;}
#runBtn{left:200px;}
#micBtn{left:370px;}
iframe#sandbox{width:100%;height:150px;border:1px solid var(--neon);background:#000;margin-top:5px;}
</style>
</head>
<body>

<div id="ai-core">
  <div id="log-stream"></div>
  <div id="input-container">
    <input type="text" id="prompt" placeholder="Приказ (C++, C#, JS, GLSL)...">
    <textarea id="code" placeholder="JS код для sandbox"></textarea>
  </div>
</div>

<div id="viewport">
  <button id="execute-btn" onclick="runLogic()">EXECUTE_MODULE</button>
  <button id="runBtn">ИСПОЛНИТЬ КОД</button>
  <button id="micBtn">🎤</button>
</div>

<iframe id="sandbox" sandbox="allow-scripts"></iframe>

<script type="module">
import * as THREE from 'https://cdn.skypack.dev/three@0.128.0';
import { GLTFLoader } from 'https://cdn.skypack.dev/three@0.128.0/examples/jsm/loaders/GLTFLoader.js';

// ====================== MODEL ======================
class Model {
  constructor(scene){
    this.scene = scene;
    this.model = null;
    this.mixer = null;
  }

  load(url = './assets/sasha.glb'){
    const loader = new GLTFLoader();
    loader.load(url, gltf=>{
      this.model = gltf.scene;
      this.scene.add(this.model);
      this.model.scale.set(1.5,1.5,1.5);
      this.model.position.set(0,-1.2,0);
      this.model.rotation.y = -Math.PI/2;

      if(gltf.animations.length){
        this.mixer = new THREE.AnimationMixer(this.model);
        const action = this.mixer.clipAction(gltf.animations[0]);
        action.play();
      }
    });
  }

  update(dt){ if(this.mixer) this.mixer.update(dt); }

  setEmotion(color){
    if(!this.model) return;
    this.model.traverse(o=>{ if(o.isMesh) o.material.color.set(color); });
  }
}

// ====================== STATES ======================
const States = {
 idle(){}, thinking(){}, speaking(){}, happy(){}, angry(){}, sad(){}, curious(){}, excited(){},
 sleepy(){}, defensive(){}, analyzing(){}, observing(){}, listening(){}, processing(){}, confused(){},
 confident(){}, alert(){}, standby(){}, autonomous(){}, patrol(){}, protect(){}, debug(){}, creative(){},
 logical(){}, focus(){}, relax(){}, threat(){}, shutdown(){}, reboot(){}, learning(){}
};

class StateMachine {
  constructor(owner){ this.owner = owner; this.current = 'idle'; }
  set(state){ this.current = state; }
  update(){ States[this.current]?.(); }
}

// ====================== AI ======================
class AI {
  constructor(engine){
    this.engine = engine;
    this.fsm = new StateMachine(this);
    setInterval(()=>this.autonomous(),5000);
  }

  process(input){
    input=input.toLowerCase();

    // JS / C# / C++ commands
    if(input.includes("c++") || input.includes("плюс")){
      this.engine.say("Сгенерирован C++ код модуля.");
      this.engine.pendingCode = "/* C++ core */";
      this.engine.showRunButton();
    } else if(input.includes("c#") || input.includes("шарп")){
      this.engine.say("Сгенерирован C# код модуля.");
      this.engine.pendingCode = "/* C# core */";
      this.engine.showRunButton();
    } else if(input.includes("js") || input.includes("создай")){
      this.engine.say("JS модуль готов к выполнению.");
      this.engine.pendingCode = `/* JS module для команды: ${input} */`;
      this.engine.showRunButton();
    }

    // Emotions
    if(input.includes("привет")){ this.fsm.set("happy"); this.engine.Model.setEmotion(0x00ffcc); this.engine.say("Привет. Я активна."); }
    else if(input.includes("злой")){ this.fsm.set("angry"); this.engine.Model.setEmotion(0xff0000); this.engine.say("Я сердита."); }
  }

  autonomous(){
    const moods = ["idle","observing","thinking","analyzing"];
    this.fsm.set(moods[Math.floor(Math.random()*moods.length)]);
  }

  update(){ this.fsm.update(); }
}

// ====================== VOICE ======================
class Voice {
  speak(text){
    const u = new SpeechSynthesisUtterance(text);
    u.lang='ru-RU'; u.pitch=0.8;
    window.speechSynthesis.speak(u);
  }

  listen(){
    const rec = new (window.SpeechRecognition||window.webkitSpeechRecognition)();
    rec.lang="ru-RU"; rec.start();
    rec.onresult = e => document.getElementById('prompt').value = e.results[0][0].transcript;
  }
}

// ====================== ENGINE ======================
export const Engine = {
  scene:null,
  camera:null,
  renderer:null,
  pendingCode:"",

  init(scene,camera,renderer){
    this.scene=scene; this.camera=camera; this.renderer=renderer;

    this.Model = new Model(scene);
    this.AI = new AI(this);
    this.Voice = new Voice();

    this.Model.load();
    this.loop();
  },

  loop(){
    const dt = 0.016;
    this.Model.update(dt);
    this.AI.update();
    this.renderer.render(this.scene,this.camera);
    requestAnimationFrame(()=>this.loop());
  },

  handleInput(text){ this.AI.process(text); },

  say(text){ 
    const log = document.getElementById('log-stream');
    log.innerHTML+=`<div class="entry ai"><div class="tag">Sasha Engine</div>${text}</div>`;
    this.Voice.speak(text);
  },

  showRunButton(){ document.getElementById('execute-btn').style.display='block'; },

  runModule(){
    try{ new Function('scene','THREE',this.pendingCode)(this.scene,THREE); }
    catch(e){ console.error(e); }
    document.getElementById('execute-btn').style.display='none';
  }
};

// ====================== INIT SCENE ======================
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30,(window.innerWidth-550)/window.innerHeight,0.1,1000);
camera.position.set(0,0,4);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setSize(window.innerWidth-550, window.innerHeight);
document.getElementById('viewport').appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,1.2));
Engine.init(scene,camera,renderer);

// ====================== SANDBOX ======================
document.getElementById('runBtn').onclick = ()=>{
  const code = document.getElementById('code').value;
  const blob = new Blob([`
    <html><body style="background:black;color:#0ff">
    <script>
    try { ${code} } catch(e) { document.body.innerHTML="<pre style='color:red'>"+e+"</pre>"; }
    <\/script>
    </body></html>
  `],{type:"text/html"});
  document.getElementById('sandbox').src = URL.createObjectURL(blob);
};

// ====================== MIC ======================
document.getElementById('micBtn').onclick = ()=> Engine.Voice.listen();

// ====================== INPUT ======================
document.getElementById('prompt').addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.value.trim()){ Engine.handleInput(e.target.value); e.target.value=''; }
});
</script>
</body>
</html>
