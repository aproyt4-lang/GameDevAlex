<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SASHA AI - TASK EXECUTOR</title>
    <style>
        :root { --neon: #00f2ff; --bg: #050505; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Consolas', monospace; display: flex; height: 100vh; overflow: hidden; }
        
        /* ИНТЕРФЕЙС */
        #ui-panel { width: 500px; background: #080808; border-right: 2px solid #222; display: flex; flex-direction: column; z-index: 10; }
        #log { flex: 1; overflow-y: auto; padding: 25px; }
        .msg { margin-bottom: 30px; border-left: 3px solid #333; padding-left: 15px; }
        .msg.ai { border-left-color: var(--neon); }
        
        /* КОД И ИНСТРУКЦИИ */
        .output-box { background: #000; border: 1px solid #1a1a1a; margin-top: 15px; border-radius: 4px; }
        .output-header { background: #111; padding: 8px 12px; font-size: 11px; color: var(--neon); border-bottom: 1px solid #222; }
        .output-content { padding: 15px; font-size: 13px; color: #ccc; white-space: pre-wrap; line-height: 1.5; }

        /* ВВОД */
        #input-zone { padding: 20px; background: #0a0a0a; border-top: 1px solid #222; }
        input { width: 100%; background: #000; border: 1px solid #444; color: var(--neon); padding: 15px; outline: none; border-radius: 4px; font-size: 14px; }
        
        /* 3D ОКНО */
        #viewport { flex: 1; position: relative; }
        #run-btn { position: absolute; bottom: 30px; left: 30px; background: var(--neon); color: #000; border: none; padding: 15px 35px; font-weight: bold; cursor: pointer; display: none; box-shadow: 0 0 20px var(--neon); }
    </style>
</head>
<body>

<div id="ui-panel">
    <div id="log"></div>
    <div id="input-zone">
        <input type="text" id="userInput" placeholder="Опишите задачу (напр. 'создай сферу' или 'код на C++ для AI')..." autocomplete="off">
    </div>
</div>

<div id="viewport">
    <button id="run-btn" onclick="executeJS()">ЗАПУСТИТЬ JS МОДУЛЬ</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
    let scene, camera, renderer, sasha, activeJS = "";
    let isSpeaking = false, clock = new THREE.Clock();

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(40, (window.innerWidth - 500) / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 4.5);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth - 500, window.innerHeight);
        document.getElementById('viewport').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.5));
        
        new THREE.GLTFLoader().load("SashaAI.glb", (g) => {
            sasha = g.scene;
            sasha.scale.set(1.6, 1.6, 1.6);
            sasha.position.set(0, -1.4, 0);
            scene.add(sasha);
        });

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        if (sasha) {
            sasha.position.y = -1.4 + Math.sin(t * 1.5) * 0.05;
            if (isSpeaking) {
                sasha.scale.y = 1.6 + Math.abs(Math.sin(t * 12)) * 0.2;
            } else {
                sasha.scale.y = 1.6;
            }
        }
        renderer.render(scene, camera);
    }

    function speak(text) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ru-RU';
        msg.onstart = () => isSpeaking = true;
        msg.onend = () => isSpeaking = false;
        window.speechSynthesis.speak(msg);
    }

    function handleTask(query) {
        const q = query.toLowerCase();
        let type = "INFO";
        let content = "";
        let responseText = "Задача принята, приступаю к выполнению.";

        speak(responseText);

        // ЛОГИКА ГЕНЕРАЦИИ
        if (q.includes("c++") || q.includes("плюс")) {
            type = "C++ INSTRUCTION";
            content = "1. Создать класс ядра SashaCore.\n2. Инициализировать обработчик прерываний.\n3. Подключить библиотеку ввода-вывода для консоли.\n4. Написать метод Run() с циклом обработки команд.";
            document.getElementById('run-btn').style.display = 'none';
        } 
        else if (q.includes("c#") || q.includes("шарп")) {
            type = "C# INSTRUCTION";
            content = "1. Создать MonoBehaviour скрипт 'SashaTask'.\n2. Добавить публичные переменные для настройки скорости.\n3. Использовать метод Update() для просчета логики.\n4. Реализовать Event-систему для связи с другими объектами.";
            document.getElementById('run-btn').style.display = 'none';
        }
        else {
            type = "JAVASCRIPT GENERATED";
            // ПРИМЕР: если в запросе "сфера" - создаем сферу, иначе тор
            if (q.includes("сфера") || q.includes("шар")) {
                content = "const g = new THREE.SphereGeometry(1, 32, 32);\nconst m = new THREE.MeshPhongMaterial({ color: 0x00f2ff, wireframe: true });\nconst mesh = new THREE.Mesh(g, m);\nscene.add(mesh);";
            } else {
                content = "const g = new THREE.TorusKnotGeometry(1, 0.3, 100, 16);\nconst m = new THREE.MeshPhongMaterial({ color: 0x00f2ff });\nconst mesh = new THREE.Mesh(g, m);\nscene.add(mesh);";
            }
            activeJS = content;
            document.getElementById('run-btn').style.display = 'block';
        }

        addLog(query, responseText, content, type);
    }

    function addLog(userText, aiText, content, type) {
        const log = document.getElementById('log');
        
        // Юзер
        const uDiv = document.createElement('div');
        uDiv.className = 'msg';
        uDiv.innerHTML = `<div style="color:#666; font-size:10px;">ВВОД ПОЛЬЗОВАТЕЛЯ</div><div>${userText}</div>`;
        log.appendChild(uDiv);

        // ИИ
        const aDiv = document.createElement('div');
        aDiv.className = 'msg ai';
        aDiv.innerHTML = `
            <div style="color:var(--neon); font-size:10px;">SASHA EXECUTOR</div>
            <div>${aiText}</div>
            <div class="output-box">
                <div class="output-header">${type}</div>
                <div class="output-content">${content}</div>
            </div>
        `;
        log.appendChild(aDiv);
        log.scrollTop = log.scrollHeight;
    }

    function executeJS() {
        try {
            const func = new Function('scene', 'THREE', activeJS);
            func(scene, THREE);
            document.getElementById('run-btn').style.display = 'none';
        } catch(e) { console.error(e); }
    }

    document.getElementById('userInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && e.target.value.trim()) {
            handleTask(e.target.value);
            e.target.value = '';
        }
    });

    window.onload = init;
</script>
</body>
</html>
