<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Sasha Engine | True AI Interface</title>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Consolas', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .main-frame { width: 900px; height: 650px; border: 2px solid #00ff41; display: flex; flex-direction: column; box-shadow: 0 0 20px #00ff41; background: #000; }
        .header { padding: 10px; border-bottom: 1px solid #00ff41; text-align: center; font-weight: bold; letter-spacing: 5px; }
        
        .display-area { flex: 1; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .code-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 20px; flex: 1; }
        .code-block { border: 1px solid #444; padding: 10px; font-size: 11px; position: relative; background: #0a0a0a; overflow: hidden; }
        .code-block::before { content: attr(data-lang); position: absolute; top: 0; right: 0; background: #444; color: #fff; padding: 2px 5px; }

        .input-zone { padding: 20px; border-top: 1px solid #00ff41; display: flex; gap: 10px; }
        input { flex: 1; background: transparent; border: 1px solid #00ff41; color: #00ff41; padding: 10px; outline: none; }
        button { background: #00ff41; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        
        .status-msg { color: #fff; margin-bottom: 10px; min-height: 20px; border-left: 3px solid #00ff41; padding-left: 10px; }
    </style>
</head>
<body>

<div class="main-frame">
    <div class="header">SASHA ENGINE v3.0 - ACTIVE</div>
    
    <div class="display-area">
        <div id="status" class="status-msg">Система ожидает прямого приказа...</div>
        <div class="code-grid">
            <div class="code-block" data-lang="JavaScript"><div id="js-out">// JS Code</div></div>
            <div class="code-block" data-lang="C++"><div id="cpp-out">// C++ Instruction</div></div>
            <div class="code-block" data-lang="C#"><div id="cs-out">// C# Script</div></div>
        </div>
        <button id="execBtn" style="display:none; margin-top:10px;" onclick="runJS()">ИСПОЛНИТЬ JAVASCRIPT</button>
    </div>

    <div class="input-zone">
        <input type="text" id="cmd" placeholder="Введи задачу (цвет, объект, действие)..." onkeypress="if(event.key==='Enter') process()">
        <button onclick="process()">ВЫПОЛНИТЬ</button>
    </div>
</div>

<script>
    const statusBox = document.getElementById('status');
    const voices = ["Задача принята, приступаю к кодингу", "Понял тебя. Генерирую решение", "Есть контакт. Код готов", "Сделано. Проверяй вкладки"];

    function speak(text) {
        window.speechSynthesis.cancel(); // Сброс очереди
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ru-RU';
        window.speechSynthesis.speak(msg);
    }

    function process() {
        const val = document.getElementById('cmd').value.toLowerCase();
        if(!val) return;

        // Разные фразы для озвучки
        const randomVoice = voices[Math.floor(Math.random() * voices.length)];
        statusBox.innerText = "АНАЛИЗ: " + val.toUpperCase();
        speak(randomVoice);

        let color = val.includes("красн") ? "red" : (val.includes("син") ? "blue" : "green");
        let obj = val.includes("куб") ? "Cube" : (val.includes("сфер") ? "Sphere" : "Object");

        // Генерация кода
        const codes = {
            js: `// Создание ${obj}\nconst el = document.createElement('div');\nel.style.cssText = 'width:100px;height:100px;background:${color};margin:20px;box-shadow:0 0 20px ${color}';\ndocument.body.appendChild(el);`,
            cpp: `// C++: Рендер ${obj}\n#include <graphics.h>\nvoid draw() {\n  setcolor(${color.toUpperCase()});\n  rectangle(100, 100, 200, 200);\n}`,
            cs: `// C#: Unity Script\npublic void Create() {\n  var obj = GameObject.CreatePrimitive(PrimitiveType.${obj});\n  obj.GetComponent<Renderer>().material.color = Color.${color};\n}`
        };

        document.getElementById('js-out').innerText = codes.js;
        document.getElementById('cpp-out').innerText = codes.cpp;
        document.getElementById('cs-out').innerText = codes.cs;
        document.getElementById('execBtn').style.display = 'block';
        document.getElementById('cmd').value = "";
    }

    function runJS() {
        try { eval(document.getElementById('js-out').innerText); } catch(e) { alert(e); }
    }
</script>

</body>
</html>
