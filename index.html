<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Sasha Engine | AI Training Lab</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #eee; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #ai-training-sector { background: #252525; padding: 20px; border-bottom: 2px solid #333; }
        textarea { width: 100%; height: 80px; background: #333; color: #fff; border: 1px solid #444; padding: 10px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0056b3; }
        #chat-window { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px; border-radius: 5px; max-width: 80%; }
        .user { background: #004a99; align-self: flex-end; }
        .ai { background: #333; align-self: flex-start; border-left: 4px solid #007bff; }
        .controls { padding: 20px; background: #252525; display: flex; gap: 10px; }
        #user-input { flex-grow: 1; padding: 10px; background: #333; border: 1px solid #444; color: white; }
    </style>
</head>
<body>

<div id="ai-training-sector">
    <h3>Панель обучения Sasha Engine</h3>
    <textarea id="knowledge-input" placeholder="Вставь сюда специфику кода, мануалы или правила стилистики..."></textarea>
    <button onclick="saveKnowledge()">Загрузить знания в мозг ИИ</button>
    <div id="knowledge-status">Знаний в базе: 0</div>
</div>

<div id="chat-window">
    <div class="msg ai">Система готова. Обучи меня или задай вопрос по Sasha Engine.</div>
</div>

<div class="controls">
    <input type="text" id="user-input" placeholder="Введите запрос...">
    <button onclick="handleSend()">Отправить</button>
</div>

<script>
    // --- 1. ПАМЯТЬ И ОБУЧЕНИЕ ---
    let sashaKnowledgeBase = JSON.parse(localStorage.getItem('sasha_ai_data')) || [];
    let chatHistory = [];

    function updateKnowledgeStatus() {
        document.getElementById('knowledge-status').innerText = `Знаний в базе: ${sashaKnowledgeBase.length}`;
    }
    updateKnowledgeStatus();

    function saveKnowledge() {
        const input = document.getElementById('knowledge-input');
        const text = input.value.trim();
        if (text) {
            sashaKnowledgeBase.push(text);
            localStorage.setItem('sasha_ai_data', JSON.stringify(sashaKnowledgeBase));
            input.value = "";
            updateKnowledgeStatus();
            addMessageToChat("system", "База знаний обновлена успешно.");
        }
    }

    // --- 2. ЛОГИКА ЧАТА ---
    async function handleSend() {
        const input = document.getElementById('user-input');
        const prompt = input.value.trim();
        if (!prompt) return;

        addMessageToChat("user", prompt);
        input.value = "";

        // Подготовка контекста обучения
        const knowledgeContext = sashaKnowledgeBase.join("\n---\n");
        
        // Формирование сообщения для ИИ
        const messages = [
            { 
                role: "system", 
                content: `Ты — Sasha Engine AI. Твои правила и база знаний:\n${knowledgeContext}\n
                Всегда придерживайся этих правил. Если ответа нет в базе, используй логику C++20 и Three.js.` 
            },
            ...chatHistory,
            { role: "user", content: prompt }
        ];

        // Заглушка вызова ИИ (замени на свой engine.chat.completions.create)
        addMessageToChat("ai", "Генерирую ответ с учетом обучения...");
        
        /* 
        Пример вызова:
        const reply = await engine.chat.completions.create({ messages });
        const aiText = reply.choices[0].message.content;
        */
        
        // Для теста просто выведем структуру в консоль
        console.log("Отправка в ИИ с контекстом:", messages);
    }

    function addMessageToChat(role, text) {
        const win = document.getElementById('chat-window');
        const div = document.createElement('div');
        div.className = `msg ${role === 'user' ? 'user' : 'ai'}`;
        div.innerText = text;
        win.appendChild(div);
        win.scrollTop = win.scrollHeight;
        
        if (role !== 'system') {
            chatHistory.push({ role, content: text });
            if (chatHistory.length > 10) chatHistory.shift(); // Лимит памяти диалога
        }
    }
</script>

</body>
</html>
