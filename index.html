<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SASHA AI - FIX FINAL</title>
    <style>
        :root { --neon: #00f2ff; --bg: #050505; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #chat-side { width: 450px; background: #080808; border-right: 1px solid #222; display: flex; flex-direction: column; z-index: 10; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; }
        .msg { margin-bottom: 20px; border-bottom: 1px solid #111; padding-bottom: 10px; }
        .label { font-size: 10px; font-weight: bold; letter-spacing: 2px; margin-bottom: 5px; text-transform: uppercase; }
        .label.ai { color: var(--neon); }
        .label.user { color: #555; }
        .code-box { background: #000; border: 1px solid #333; border-radius: 6px; margin-top: 10px; overflow: hidden; }
        .code-header { background: #151515; padding: 5px 12px; font-size: 11px; color: var(--neon); border-bottom: 1px solid #222; }
        .code-content { padding: 12px; overflow-x: auto; color: #adbac7; white-space: pre; font-size: 12px; font-family: monospace; }
        #input-zone { padding: 15px; border-top: 1px solid #222; }
        input { width: 100%; background: #000; border: 1px solid #333; color: var(--neon); padding: 12px; outline: none; border-radius: 4px; box-sizing: border-box; }
        #viewport { flex: 1; position: relative; }
        #run-btn { position: absolute; bottom: 20px; right: 20px; padding: 12px 24px; background: var(--neon); color: #000; border: none; font-weight: bold; cursor: pointer; display: none; }
    </style>
</head>
<body>

<div id="chat-side">
    <div id="messages"></div>
    <div id="input-zone">
        <input type="text" id="userInput" placeholder="Приказ для Саши..." autocomplete="off">
    </div>
</div>

<div id="viewport">
    <button id="run-btn" onclick="runJS()">ЗАПУСТИТЬ JS</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
    let scene, camera, renderer, sasha, currentJS = "";
    let isSpeaking = false, clock = new THREE.Clock();
    const synth = window.speechSynthesis;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, (window.innerWidth - 450) / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5); // Прямой вид

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth - 450, window.innerHeight);
        document.getElementById('viewport').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.5));
        
        new THREE.GLTFLoader().load("SashaAI.glb", (g) => {
            sasha = g.scene;
            sasha.scale.set(1.5, 1.5, 1.5);
            sasha.position.set(0, -1.5, 0);
            scene.add(sasha);
        }, undefined, (e) => console.log("Жду файл SashaAI.glb"));

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        if (sasha) {
            let bob = Math.sin(t * 1.5) * 0.05;
            if (isSpeaking) {
                bob = Math.sin(t * 6) * 0.1;
                sasha.scale.y = 1.5 + Math.abs(Math.sin(t * 12)) * 0.2;
            } else {
                sasha.scale.y = 1.5;
            }
            sasha.position.y = -1.5 + bob;
        }
        renderer.render(scene, camera);
    }

    function speak(txt) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(txt);
        u.lang = 'ru-RU';
        u.onstart = () => isSpeaking = true;
        u.onend = () => isSpeaking = false;
        window.speechSynthesis.speak(u);
    }

    function aiBrain(query) {
        const q = query.toLowerCase();
        let lang = "javascript";
        let code = "";
        let response = "Да. Система активирована. Запрос принят.";

        if (q.includes("c#") || q.includes("си шарп")) {
            lang = "csharp";
            response = "Генерирую скрипт на C# для Unity. Логика готова.";
            code = "using UnityEngine;\n\npublic class SashaMove : MonoBehaviour {\n    void Update() {\n        transform.Rotate(0, 50 * Time.deltaTime, 0);\n    }\n}";
            document.getElementById('run-btn').style.display = 'none';
        } 
        else if (q.includes("c++") || q.includes("плюс")) {
            lang = "cpp";
            response = "Подготавливаю код на C++. Структура оптимизирована.";
            code = "#include <iostream>\n\nint main() {\n    std::cout << \"Sasha Engine v3.0 Online\" << std::endl;\n    return 0;\n}";
            document.getElementById('run-btn').style.display = 'none';
        } 
        else {
            lang = "javascript";
            response = "Создаю визуальный объект на JavaScript. Можешь запускать.";
            code = "const g = new THREE.TorusKnotGeometry(1, 0.3, 100, 16);\nconst m = new THREE.MeshPhongMaterial({ color: 0x00f2ff });\nconst mesh = new THREE.Mesh(g, m);\nscene.add(mesh);";
            currentJS = code;
            document.getElementById('run-btn').style.display = 'block';
        }

        speak(response);
        addMsg('ai', response, code, lang);
    }

    function addMsg(sender, text, code = null, lang = "") {
        const box = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = 'msg';
        const label = `<div class="label ${sender}">${sender === 'user' ? 'Вы' : 'Саша'}</div>`;
        let codeHtml = "";
        if (code) {
            const escapedCode = code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            codeHtml = `<div class="code-box"><div class="code-header">${lang.toUpperCase()}</div><div class="code-content">${escapedCode}</div></div>`;
        }
        div.innerHTML = `${label}<div>${text}</div>${codeHtml}`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function runJS() {
        try {
            const f = new Function('scene', 'THREE', currentJS);
            f(scene, THREE);
            document.getElementById('run-btn').style.display = 'none';
        } catch(e) { console.error(e); }
    }

    document.getElementById('userInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && e.target.value.trim()) {
            const val = e.target.value;
            addMsg('user', val);
            aiBrain(val);
            e.target.value = '';
        }
    });

    window.onload = init;
</script>
</body>
</html>
